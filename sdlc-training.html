}
a();
console.log(b);       // ReferenceError: b is not defined (global can't see inside a)`,"Scope chain"]},

  {t:"8. let, const and the Temporal Dead Zone", d:"<code>let</code> and <code>const</code> declarations <b>are hoisted</b> too, but their memory is kept in a separate space and not initialised. From the start of the scope until the line where they are declared, they are in the <b>Temporal Dead Zone (TDZ)</b>: touching them throws a <code>ReferenceError</code>. <code>let</code> can be reassigned but not re-declared in the same scope; <code>const</code> must be given a value immediately and can’t be reassigned. Prefer <code>const</code>, use <code>let</code> when the value must change, and avoid <code>var</code>.",
   dg:["Life of a let variable.", F([["Scope starts","a is hoisted, uninitialised"],["TDZ","console.log(a) → ReferenceError"],["let a = 10;","initialised: TDZ ends"],["Normal use","console.log(a) → 10"]],{w:170,hl:[1]})],
   tb:{head:["Code","Error","Why"], rows:[["console.log(a); let a = 1;","ReferenceError: Cannot access 'a' before initialization","a is in the TDZ"],["let a = 1; let a = 2;","SyntaxError: Identifier 'a' has already been declared","No re-declaring let/const in the same scope"],["const b;","SyntaxError: Missing initializer in const declaration","const needs a value at once"],["const b = 1; b = 2;","TypeError: Assignment to constant variable","const can’t be reassigned"],["console.log(z);","ReferenceError: z is not defined","Never declared"]]}},

  {t:"9. Block scope and shadowing", d:"A <b>block</b> is code inside <code>{ }</code>, used to group several statements where JavaScript expects one (if, for, while). <code>let</code> and <code>const</code> are <b>block-scoped</b>: they live only inside the block. <code>var</code> is <b>function-scoped</b>: it ignores blocks. <b>Shadowing</b> means a variable inside a block has the same name as one outside; inside the block, the inner one wins. Shadowing a <code>let</code> with a <code>var</code> in an inner block is <b>illegal shadowing</b> and gives a SyntaxError.",
   dg:["Where each kind of variable lives.", C([{t:"var",s:"function scope",items:["Ignores { } blocks","Stored in the function’s / global memory","Shadowing it inside a block changes the outer value!"]},{t:"let",s:"block scope",items:["Exists only inside its { }","Stored in a separate block memory","Can be reassigned"]},{t:"const",s:"block scope",items:["Exists only inside its { }","Must be initialised","Can’t be reassigned"]}])],
   code:["js",`var a = 100; let b = 200;
{
  var a = 10;          // same var a: overwrites the global one!
  let b = 20;          // a new b, shadows the outer b inside this block only
  console.log(a, b);   // 10 20
}
console.log(a, b);     // 10 200   ← var leaked out, let did not

let c = 1;
{ var c = 2; }         // SyntaxError: illegal shadowing (var would escape the block)`,"Block scope and shadowing"]},

  {t:"10. Closures", d:"<b>In simple words:</b> a <b>closure</b> is a function <b>bundled together with its lexical environment</b>. When a function is returned from (or passed out of) another function, it remembers the variables that existed where it was written, even after the outer function has finished. <b>Think of it like</b> a backpack: the inner function carries the outer function’s variables with it wherever it goes. Closures power data hiding, module patterns, currying, memoisation, <code>once()</code> helpers, and callbacks for timers and events. The cost: variables kept in closures can’t be garbage-collected while the function is reachable, which can waste memory if overused.",
   dg:["The returned function keeps a link to x’s variables after x() has finished.", F([["x() is called","a = 7, y defined inside"],["x returns y","y carries a closure { a }"],["x’s context is deleted","but a lives on in the closure"],["later: z()","logs 7 ✓"]],{w:170,hl:[1]})],
   code:["js",`function x() {
  var a = 7;
  function y() { console.log(a); }
  return y;            // return the function AND its lexical environment
}
var z = x();           // x() is finished and gone from the call stack
z();                   // 7: y still remembers a through the closure

// Practical use: a function that runs only once
function once(fn) {
  let done = false;                       // private, kept alive by the closure
  return (...args) => { if (!done) { done = true; return fn(...args); } };
}
const placeOrderOnce = once(placeOrder);  // double-tapping "Pay" can't place two orders`,"Closures"]},

  {t:"11. setTimeout + closures: the classic interview question", d:"<code>setTimeout</code> doesn’t pause the program: it registers the callback (with its closure) and moves on. With <code>var</code>, all callbacks in a loop share <b>one</b> variable <code>i</code>, which is already 6 when they run. With <code>let</code>, every loop iteration gets a <b>new</b> <code>i</code>, so each callback closes over its own copy. Without <code>let</code>, you can create a new scope per iteration with a wrapper function.",
   dg:["Same loop, different scoping.", LN([{t:"var i",c:3,steps:[["Loop finishes instantly","i becomes 6"],["After 1–5 s, callbacks run"],["All read the same i","prints 6 6 6 6 6"]]},{t:"let i",c:1,steps:[["Each iteration gets a new i","1, 2, 3, 4, 5"],["Callbacks run later"],["Each reads its own i","prints 1 2 3 4 5"]]}])],
   code:["js",`for (var i = 1; i <= 5; i++) {
  setTimeout(() => console.log(i), i * 1000);   // 6 6 6 6 6
}

for (let i = 1; i <= 5; i++) {
  setTimeout(() => console.log(i), i * 1000);   // 1 2 3 4 5
}

// Fix without let: a new function scope per iteration
for (var i = 1; i <= 5; i++) {
  (function (n) { setTimeout(() => console.log(n), n * 1000); })(i);   // 1 2 3 4 5
}`,"setTimeout in a loop"]},

  {t:"12. Closures in interviews: data privacy and garbage collection", d:"Closures let you build objects whose data can’t be touched from outside (<b>data privacy / encapsulation</b>), without classes. Interviewers also ask about memory: modern engines like V8 do <b>smart garbage collection</b>. If a closure never uses a variable from its parent, the engine can free that variable even though the closure exists.",
   code:["js",`function createCounter() {
  let count = 0;                    // private: no one outside can change it directly
  return {
    increment() { return ++count; },
    decrement() { return --count; },
    value()     { return count; },
  };
}
const cart = createCounter();
cart.increment(); cart.increment();
console.log(cart.value());          // 2
console.log(cart.count);            // undefined: data is hidden

function outer() {
  let used = 1, unused = new Array(1e6).fill("x");
  return () => used;                // V8 can garbage-collect "unused"
}`,"Data privacy with closures"]},

  {t:"13. First-class functions and the ways to write a function", d:"Functions in JavaScript are <b>first-class citizens</b>: they can be stored in variables, passed as arguments, and returned from other functions, just like numbers or strings. That ability is what makes callbacks, closures and higher-order functions possible.",
   tb:{head:["Form","Example","Hoisted?"], rows:[["Function statement / declaration","function a() {}","Yes, fully"],["Function expression","var b = function () {};","Only as undefined (var)"],["Anonymous function","function () {}  (used as a value)","n/a: must be used as a value"],["Named function expression","var c = function xyz() {};","xyz is visible only inside itself"],["Arrow function","const d = () => {};","No (TDZ for const)"]]},
   code:["js",`function greet(name) { return "Hi " + name; }   // name = parameter
greet("Priya");                                  // "Priya" = argument

const run = function (fn) { return fn("Arjun"); };  // function received as an argument
run(greet);                                          // "Hi Arjun"

function makeAdder(x) { return y => x + y; }         // function returned as a value
const add5 = makeAdder(5);  add5(10);                // 15`,"Functions as values"]},

  {t:"14. Callback functions and event listeners", d:"A <b>callback</b> is a function you pass to another function to be called later. Callbacks are how JavaScript, with only one thread, handles things that take time: “run this when the timer ends / the user clicks / the data arrives”. Event listeners are callbacks with closures. Never run heavy work directly on the main thread: while it is busy, the page freezes. Remove event listeners you no longer need, because their closures keep memory alive.",
   dg:["What happens to an event listener’s callback.", F([["addEventListener","browser stores cb + its closure"],["User clicks","event fires"],["cb goes to callback queue"],["Event loop","waits for empty call stack"],["cb runs on call stack"]])],
   code:["js",`function attachCounter() {
  let clicks = 0;                                   // kept alive by the closure
  document.getElementById("add-btn").addEventListener("click", function onClick() {
    clicks++;
    console.log("Add clicked", clicks, "times");
  });
}
attachCounter();
// Clean up when the component is removed:
// button.removeEventListener("click", onClick);`,"Event listener with a closure"]},

  {t:"15. Asynchronous JavaScript and the event loop", d:"The JavaScript engine has only a call stack; it can’t wait for timers or networks. The <b>browser</b> provides those superpowers as <b>Web APIs</b>: <code>setTimeout</code>, DOM events, <code>fetch</code>, <code>localStorage</code>, <code>console</code>, <code>location</code>, all reached through <code>window</code>. When a Web API finishes, it puts the callback into a queue. The <b>event loop</b> constantly checks: “is the call stack empty?” If yes, it moves the next callback onto the stack. There are two queues. The <b>microtask queue</b> (promise callbacks, <code>queueMicrotask</code>, MutationObserver) always has <b>higher priority</b> than the <b>callback / task queue</b> (setTimeout, events). If microtasks keep adding microtasks, task callbacks can wait for a long time (<b>starvation</b>).",
   dg:["The JavaScript runtime in a browser.", UG(355, [
     {id:"cs",x:10,y:20,w:170,h:290,l:"Call stack",k:"grp"},
     {id:"s1",x:30,y:250,w:130,h:40,l:"Global EC",k:"c1"},{id:"s2",x:30,y:200,w:130,h:40,l:"callback()",k:"acc"},
     {id:"wa",x:250,y:10,w:300,h:120,l:"Web APIs (browser)",k:"grp"},
     {id:"w1",x:265,y:40,w:125,h:34,l:"setTimeout"},{id:"w2",x:410,y:40,w:125,h:34,l:"fetch"},{id:"w3",x:265,y:84,w:270,h:34,l:"DOM events, localStorage, console"},
     {id:"mq",x:250,y:170,w:300,h:44,l:"Microtask queue (promises): first",k:"c2"},
     {id:"tq",x:250,y:250,w:300,h:44,l:"Callback / task queue (timers, events)",k:"c3"},
     {id:"el",x:610,y:180,w:140,h:70,l:"Event loop",s:"stack empty? → push next",k:"pill acc"}],
    [{f:"cs",t:"wa",d:"M180,70 H250",l:"register",lx:215,ly:56},
     {f:"w2",t:"mq",d:"M472,130 V170",l:"promise settled",lx:472,ly:150},
     {f:"w1",t:"tq",d:"M327,130 V150 H230 V272 H250",l:"timer done",lx:215,ly:215},
     {f:"mq",t:"el",d:"M550,192 H610"},{f:"tq",t:"el",d:"M550,272 H680 V250"},
     {f:"el",t:"cs",d:"M720,250 V335 H95 V310",l:"push callback onto the call stack",lx:400,ly:335,dash:1}])],
   code:["js",`console.log("A");
setTimeout(() => console.log("B (task)"), 0);
Promise.resolve().then(() => console.log("C (microtask)"));
console.log("D");
// Output: A, D, C (microtask), B (task)
// Synchronous code first; then ALL microtasks; then the next task.`,"Microtasks run before tasks"]},

  {t:"16. Inside the JavaScript engine: Google’s V8", d:"A <b>JavaScript runtime environment</b> = the engine + APIs + event loop + queues. Browsers and Node.js are different runtimes; Node has no <code>window</code> or DOM but adds file and network APIs. The <b>engine</b> (V8 in Chrome and Node.js, SpiderMonkey in Firefox, JavaScriptCore in Safari) turns your code into machine instructions in three steps: <b>parsing</b> (source → tokens → <b>abstract syntax tree, AST</b>), <b>compilation</b> and <b>execution</b>. JavaScript today uses <b>just-in-time (JIT)</b> compilation: V8’s interpreter <b>Ignition</b> quickly turns the AST into bytecode, and its optimising compiler <b>TurboFan</b> recompiles frequently used (“hot”) code into fast machine code. Execution uses the <b>call stack</b> and a <b>memory heap</b>, cleaned up by the <b>garbage collector</b> (mark-and-sweep: objects no longer reachable are freed).",
   dg:["How V8 runs your code.", F([["Source code","app.js"],["Parsing","tokens → AST"],["Ignition","interpreter → bytecode"],["TurboFan","hot code → optimised machine code"],["Execution","call stack + memory heap"],["Garbage collector","mark & sweep"]])]},

  {t:"17. Trust issues with setTimeout", d:"<code>setTimeout(cb, 5000)</code> does <b>not</b> guarantee the callback runs after exactly 5 seconds. It guarantees <b>at least</b> 5 seconds. When the timer ends, the callback waits in the task queue until the call stack is empty. If the main thread is busy (a long loop, heavy computation), the callback runs late. Even <code>setTimeout(cb, 0)</code> waits until all current synchronous code (and microtasks) finish, which is sometimes used on purpose to defer less important work.",
   dg:["A 5-second timer blocked by 10 seconds of work.", LN([{t:"Timeline",steps:[["0 s: setTimeout(cb, 5000) registered"],["0–10 s: long loop blocks the call stack"],["5 s: timer done, cb waits in queue"],["10 s: stack empty, cb finally runs"]]}])],
   code:["js",`console.log("start");
setTimeout(() => console.log("timer callback"), 5000);
const end = Date.now() + 10000;
while (Date.now() < end) { /* blocking the main thread for 10 s */ }
console.log("loop done");
// start → loop done (at 10 s) → timer callback (at ~10 s, NOT 5 s)`,"Blocking delays timers"]},

  {t:"18. Higher-order functions and functional programming", d:"A <b>higher-order function</b> takes a function as an argument or returns one. They let you write a general piece of logic once and plug in the specific part, following the DRY principle. This is the core of <b>functional programming</b>: small, reusable, pure functions combined together.",
   dg:["One general function, many specific rules plugged in.", F([["radius = [3, 1, 2, 4]"],["calculate(radius, logic)","higher-order function"],["logic = area → πr²","or circumference → 2πr"],["new array of results"]],{w:170})],
   code:["js",`const radius = [3, 1, 2, 4];
const area = r => Math.PI * r * r;
const circumference = r => 2 * Math.PI * r;
const diameter = r => 2 * r;

function calculate(arr, logic) {      // higher-order: takes a function
  const out = [];
  for (const r of arr) out.push(logic(r));
  return out;
}
calculate(radius, area);
calculate(radius, diameter);          // [6, 2, 4, 8]
radius.map(diameter);                 // built-in map does the same thing`,"Higher-order function"]},

  {t:"19. map, filter and reduce", d:"Three built-in higher-order functions for arrays. <b>map</b> transforms every item into a new array of the same length. <b>filter</b> keeps only items that pass a test. <b>reduce</b> combines all items into one value (a total, an object, a count). They can be chained, and none of them change the original array.",
   tb:{head:["Method","Returns","Example"], rows:[["map(fn)","New array, same length","users.map(u => u.firstName + \" \" + u.lastName)"],["filter(fn)","New array, only matching items","users.filter(u => u.age < 30)"],["reduce(fn, start)","Single value","orders.reduce((sum, o) => sum + o.total, 0)"]]},
   code:["js",`const users = [
  { firstName: "Priya", lastName: "R", age: 26 },
  { firstName: "Arjun", lastName: "K", age: 75 },
  { firstName: "Meena", lastName: "S", age: 26 },
];
users.map(u => u.firstName + " " + u.lastName);   // ["Priya R", "Arjun K", "Meena S"]
users.filter(u => u.age < 30).map(u => u.firstName); // ["Priya", "Meena"]

// reduce: count users by age → { 26: 2, 75: 1 }
users.reduce((acc, u) => { acc[u.age] = (acc[u.age] || 0) + 1; return acc; }, {});`,"map, filter, reduce"]},

  /* ---------- Season 2: async in depth ---------- */
  {t:"20. Callback hell and inversion of control", d:"Callbacks have two big problems. <b>Callback hell</b> (the “pyramid of doom”): when each step depends on the previous one, callbacks nest deeper and deeper, and the code becomes hard to read and maintain. <b>Inversion of control</b>: when you pass your callback to someone else’s function (for example a payment library), you lose control over it. They might call it twice, never call it, or call it too early. Promises were introduced to solve both.",
   dg:["Two problems with callbacks.", C([{t:"Callback hell",items:["Each step nested in the previous","Code grows sideways","Error handling repeated at every level"]},{t:"Inversion of control",items:["You hand your code to another function","You trust it to call back once, correctly","Bugs there become bugs in your flow"]}])],
   code:["js",`api.createOrder(cart, function (order) {
  api.proceedToPayment(order, function (payment) {
    api.showOrderSummary(payment, function (summary) {
      api.updateWallet(summary, function () {
        // ... the pyramid keeps growing
      });
    });
  });
});`,"Callback hell"]},

  {t:"21. Promises", d:"<b>In simple words:</b> a <b>Promise</b> is an object that represents a value that will arrive <b>in the future</b>: the eventual result (or failure) of an asynchronous operation. It starts <b>pending</b>, then becomes either <b>fulfilled</b> (with a value) or <b>rejected</b> (with an error). Once settled, it can never change, which fixes the trust problem. Instead of handing your callback to another function, you attach it to the promise with <code>.then()</code>, and it is guaranteed to run once. <b>Think of it like</b> an order token at a food counter: you get the token immediately, and it will either turn into food or an apology, exactly once.",
   dg:["The three states of a promise.", UG(200, [
     {id:"p",x:40,y:70,w:170,h:56,l:"pending",s:"waiting",k:"stt"},
     {id:"f",x:360,y:10,w:190,h:56,l:"fulfilled",s:"has a value → .then",k:"stt ok"},
     {id:"r",x:360,y:130,w:190,h:56,l:"rejected",s:"has an error → .catch",k:"stt warn"},
     {id:"n",x:590,y:66,w:160,h:64,l:"settled = immutable",k:"note"}],
    [{f:"p",t:"f",d:"M210,90 H285 V38 H360",l:"resolve(value)",lx:285,ly:62},{f:"p",t:"r",d:"M210,106 H285 V158 H360",l:"reject(error)",lx:285,ly:134}])],
   code:["js",`const user = fetch("https://api.example.com/users/42");  // returns a Promise immediately
console.log(user);           // Promise {<pending>}

user
  .then(res => res.json())   // runs once, when fulfilled
  .then(data => console.log(data.name))
  .catch(err => console.error("Failed", err));

// Promise chaining replaces callback hell:
createOrder(cart)
  .then(order => proceedToPayment(order))
  .then(payment => showOrderSummary(payment))
  .then(summary => updateWallet(summary));`,"Consuming promises"]},

  {t:"22. Creating promises, chaining and error handling", d:"You create a promise with <code>new Promise((resolve, reject) => { … })</code>: the <b>producer</b> side calls <code>resolve</code> on success or <code>reject</code> on failure. The <b>consumer</b> side uses <code>.then</code> and <code>.catch</code>. Always <b>return</b> the next promise inside <code>.then</code> so the chain continues. A <code>.catch</code> handles errors from any step above it; a <code>.then</code> placed after a <code>.catch</code> still runs.",
   dg:["A promise chain with error handling.", F([["createOrder(cart)","may reject: invalid cart"],[".then(proceedToPayment)","returns next promise"],[".then(showSummary)"],[".catch(handleError)","catches anything above"],[".then(alwaysLog)","still runs after catch"]])],
   code:["js",`function createOrder(cart) {
  return new Promise((resolve, reject) => {      // producer
    if (!cart.items.length) {
      reject(new Error("Cart is empty"));
      return;
    }
    setTimeout(() => resolve({ orderId: 1042 }), 500);   // simulate an API call
  });
}

createOrder(cart)                                  // consumer
  .then(order => proceedToPayment(order.orderId))  // RETURN the next promise
  .then(paymentInfo => console.log(paymentInfo))
  .catch(err => console.error(err.message))        // "Cart is empty"
  .then(() => console.log("This always runs"));`,"Producing and consuming a promise"]},

  {t:"23. Promise APIs: all, allSettled, race, any", d:"Four helpers run several promises together. They differ in when they finish and what they do on failure. These are frequent interview questions.",
   tb:{head:["API","Resolves when","Rejects when","Typical use"], rows:[
     ["Promise.all([p1, p2, p3])","ALL succeed → array of results","ANY one fails (fail-fast, immediately)","Load menu + offers + cart together; need all"],
     ["Promise.allSettled([...])","ALL finish, success or failure → array of {status, value/reason}","Never","Show whatever loaded; report failures"],
     ["Promise.race([...])","The FIRST to settle succeeds","The FIRST to settle fails","Timeouts: race a request against a timer"],
     ["Promise.any([...])","The FIRST to succeed","ALL fail → AggregateError with all errors","Try several mirrors / CDNs, use the fastest working"]]},
   dg:["p1 succeeds in 3 s, p2 fails in 1 s, p3 succeeds in 2 s. What does each API return?", C([{t:"all",items:["Rejects at 1 s","with p2’s error"]},{t:"allSettled",items:["Resolves at 3 s","[ok, failed, ok]"]},{t:"race",items:["Rejects at 1 s","p2 settled first"]},{t:"any",items:["Resolves at 2 s","with p3’s value"]}])]},

  {t:"24. async / await", d:"<code>async</code> and <code>await</code> are a cleaner way to write promise code. An <code>async</code> function <b>always returns a promise</b>. <code>await</code> (only allowed inside async functions, or at the top level of modules) pauses <b>that function</b> until the promise settles. Important: JavaScript itself does <b>not</b> wait. The async function is suspended and removed from the call stack, the rest of the program keeps running, and the function resumes when the promise settles. Use <code>try / catch</code> for errors.",
   dg:["What really happens at await.", SQ(["Call stack","handleOrder() (async)","Promise (API call)"],[[0,1,"call handleOrder()"],[1,2,"await fetchOrder()"],[1,0,"function suspended: leaves the stack",1],[0,0,"other code keeps running"],[2,1,"promise fulfilled (microtask)",1],[1,1,"resumes after await"],[1,0,"returns (a promise)",1]])],
   code:["js",`async function handleOrder() {
  try {
    const res = await fetch("https://api.example.com/orders/1042");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const order = await res.json();
    console.log(order.status);
  } catch (err) {
    console.error("Could not load order", err);
  }
}
handleOrder();
console.log("This logs BEFORE the order status");

// Same logic with .then:
// fetch(url).then(r => r.json()).then(o => console.log(o.status)).catch(console.error);`,"async / await with error handling"]},

  {t:"25. The this keyword", d:"<code>this</code> refers to the object a function is working with, and its value depends on <b>how the function is called</b>, not where it is written (except for arrow functions). In <b>strict mode</b> (the default in modules and classes), a plain function call gets <code>this = undefined</code>; in non-strict mode, JavaScript substitutes the global object (<b>this substitution</b>). <code>call</code>, <code>apply</code> and <code>bind</code> let you set <code>this</code> explicitly. <b>Arrow functions have no own <code>this</code></b>: they use the <code>this</code> of the place where they are written (lexical <code>this</code>).",
   tb:{head:["Where / how","Value of this"], rows:[["Global scope (browser script)","window (globalThis)"],["Plain function call, non-strict","window (this substitution)"],["Plain function call, strict mode","undefined"],["Method call: obj.method()","obj (the object before the dot)"],["fn.call(obj, a, b) / fn.apply(obj, [a, b])","obj (called immediately)"],["const g = fn.bind(obj)","obj (returns a new function for later)"],["Arrow function","this of the surrounding (lexical) scope"],["DOM event handler (regular function)","the element that received the event"],["Inside a class method","the instance (if called as a method)"]]},
   code:["js",`"use strict";
const order = {
  id: 1042,
  print() { console.log(this.id); },              // method: this = order
  printLater() { setTimeout(() => console.log(this.id), 100); },  // arrow: lexical this
};
order.print();                     // 1042
const p = order.print;  p();       // TypeError: this is undefined (lost the object)
p.call({ id: 7 });                 // 7 (this set explicitly)
const bound = order.print.bind(order);  bound();   // 1042
order.printLater();                // 1042 (arrow keeps the method's this)`,"this in practice"]}
  ];

  D.dd = JS.concat(ts ? [ts] : []);
})();

(function () {
  const D = DEEP[9][1];
  D.dd = (D.dd || []).filter(x => !x.t.startsWith("TypeScript types"));

  const TS = [
  {t:"TS 1. What is TypeScript and how does it run?", d:"<b>In simple words:</b> <b>TypeScript</b> is JavaScript <b>plus types</b>. It is a <b>statically typed superset</b> of JavaScript created by Microsoft: every JavaScript program is already valid TypeScript, and TypeScript adds the ability to say what type each value should be. Browsers and Node.js can’t run TypeScript directly, so the TypeScript compiler (<code>tsc</code>) checks your types and then <b>transpiles</b> (converts) the code into plain JavaScript. The types are used only while developing; they disappear in the output. <b>Think of it like</b> a spell-checker for code: it underlines mistakes while you type, but the final document is ordinary text.",
   dg:["From a .ts file to running JavaScript.", F([["hello.ts","let message: string"],["tsc (compiler)","type check"],["Errors?","shown in the editor / terminal"],["hello.js","types removed"],["Runs anywhere JS runs","browser or Node.js"]],{hl:[1]})],
   code:["ts",`// hello.ts: our first TypeScript program
let message: string = "Hello, World!";   // ": string" is a type annotation
console.log(message);

  {t:"React + TS 6. Generic components", d:"A <b>generic component</b> works with any item type while keeping full type safety, just like a generic function. A typical example is a list: the component handles the layout, keys and empty state, and the caller decides what each item looks like. TypeScript infers the item type from the <code>items</code> prop, so <code>renderItem</code> receives correctly typed items with autocomplete.",
   dg:["One List component, many item types.", MI([{t:"List<T>",s:"written once: layout, keys, empty state",L:[["*List<T>"],["getKey(item: T)","renderItem(item: T)"]]},{t:"T = Product",s:"menu",L:[["List<Product>"],["renders DishCard"]]},{t:"T = Order",s:"order history",L:[["List<Order>"],["renders OrderRow"]]}],{per:3,bw:150})],
   code:["tsx",`import type { ReactNode } from "react";

interface ListProps<T> {
  items: T[];
  getKey: (item: T) => string | number;
  renderItem: (item: T) => ReactNode;
  emptyText?: string;
}

export function List<T>({ items, getKey, renderItem, emptyText = "Nothing here yet" }: ListProps<T>) {
  if (items.length === 0) return <p>{emptyText}</p>;
  return <ul>{items.map(item => <li key={getKey(item)}>{renderItem(item)}</li>)}</ul>;
}

// T is inferred as Product: p.name autocompletes, p.prise is an error
<List items={products} getKey={p => p.id} renderItem={p => <DishCard name={p.name} pricePaise={p.pricePaise} onAdd={add} />} />
<List items={orders}   getKey={o => o.id} renderItem={o => <OrderRow order={o} />} emptyText="No orders yet" />`,"A generic List component"]},

  {t:"React + TS 7. Refs, null checks and type assertions", d:"<code>useRef&lt;HTMLInputElement&gt;(null)</code> creates a typed reference to a DOM element. Its <code>current</code> is <code>null</code> until React attaches it, so TypeScript makes you handle that, usually with <b>optional chaining</b> (<code>?.</code>). A <b>type assertion</b> (<code>as Type</code>) tells TypeScript to trust you without any runtime check, so if you’re wrong, the app crashes. Prefer null checks, type guards and correct generic types; use assertions only when you truly know more than the compiler.",
   code:["tsx",`import { useRef } from "react";

export function SearchBox() {

    // (inputRef.current as HTMLInputElement).focus(); // compiles, but crashes if null: avoid
  };

// A reasonable assertion: you know the API returns this shape (better: validate with zod)

  {t:"React + TS 8. Typing hooks: useReducer, useContext and custom hooks", d:"For complex state, <code>useReducer</code> with a <b>discriminated union</b> of actions is very safe: each action type has exactly the right payload, and TypeScript checks every <code>dispatch</code>. For <code>useContext</code>, type the context value and provide a custom hook that throws if the provider is missing, so components never deal with <code>undefined</code>. Custom hooks are typed like functions: annotate parameters and let the return type be inferred (or annotate it for public hooks).",
   dg:["Typed cart state with useReducer.", F([["UI calls dispatch","{ type: \"ADD\", product }"],["TypeScript checks action","only valid types & payloads"],["cartReducer","switch on action.type"],["New CartState","typed"],["Components re-render"]])],
   code:["tsx",`type CartItem  = { product: Product; qty: number };
type CartState = { items: CartItem[] };
type CartAction =
  | { type: "ADD"; product: Product }
  | { type: "REMOVE"; productId: number }
  | { type: "CLEAR" };

function cartReducer(state: CartState, action: CartAction): CartState {
  switch (action.type) {
    case "ADD":    return { items: [...state.items, { product: action.product, qty: 1 }] };
    case "REMOVE": return { items: state.items.filter(i => i.product.id !== action.productId) };
    case "CLEAR":  return { items: [] };
  }
}

const CartContext = createContext<{ state: CartState; dispatch: React.Dispatch<CartAction> } | null>(null);

export function useCart() {                       // custom hook: never returns null
  const ctx = useContext(CartContext);
  if (!ctx) throw new Error("useCart must be used inside <CartProvider>");
  return ctx;
}

const { dispatch } = useCart();
dispatch({ type: "ADD", product: dosa });         // ✓
dispatch({ type: "ADD" });                        // ✗ Property 'product' is missing`,"Typed reducer and context"]},

  {t:"React + TS 9. Strict mode and the most common TypeScript errors in React", d:"Turn on <code>\"strict\": true</code> in <code>tsconfig.json</code>. It enables the checks that catch the most bugs (null safety, no implicit <code>any</code>). When adding it to an existing project, keep your other options and fix the reported errors rather than switching strictness off. These are the errors you will see most often, and how to fix them properly.",
   tb:{head:["Error message","Typical cause","Fix"], rows:[

/* q: question, a: simple answer, an: everyday analogy. One entry per session, then one per sub-topic. */

1:{q:"What is software development?",a:"Software development is the whole process of turning an idea into a working app: understanding what people need, designing it, writing the code, testing it, releasing it, and keeping it running and improving. Many people with different skills work together to do it.",an:"Building a house. Someone decides what the family needs, an architect draws plans, builders construct it, inspectors check it, and maintenance keeps it in good shape for years.",
 s:[{q:"What is software?",a:"Software is a set of instructions that tells a computer or phone what to do. A food-ordering app is software that lets you order food.",an:"A recipe. The kitchen (computer) does nothing useful until the recipe (software) tells it what to do, step by step."},
    {q:"What is the difference between a product company and a service company?",a:"A product company makes one thing and sells it to many customers. A service company builds custom software for one client at a time, as that client asks.",an:"A packaged-snack brand sells the same biscuit to millions (product). A caterer cooks a special menu for each wedding (service)."},
    {q:"What are the types of applications?",a:"Web apps open in a browser, mobile apps are installed on phones, desktop apps are installed on computers, and SaaS apps are rented online from the company that runs them.",an:"Watching a film at a cinema (web: nothing to own), buying the DVD (desktop: you keep it), a film on your phone (mobile), or a Netflix subscription (SaaS: pay monthly, they handle everything)."},
    {q:"Who works in a software team?",a:"A team has specialists: someone who decides what to build, someone who designs how it looks, people who write code, people who test it, and people who release and run it.",an:"A film crew: director, scriptwriter, camera team, editors and distributors each do one part, and the film only works when all of them do."},
    {q:"What is business value?",a:"Business value is the real benefit a feature brings: more orders, happier customers, less cost. It is measured in numbers, not in how much code was written.",an:"A shop owner cares about whether a new display increases sales, not how many hours the carpenter spent building it."}]},
2:{q:"How do the internet and apps work together?",a:"When you tap something in an app, your phone sends a message across the internet to a computer called a server. The server looks up or saves data in a database, then sends an answer back, usually in under a second.",an:"Ordering by post: you write a letter (request), the postal system finds the address (DNS and the internet), the shop reads it and checks its stock room (server and database), and posts a reply (response)."},
3:{q:"What is programming?",a:"Programming is writing precise instructions in a language a computer understands. Every program takes some input, checks it, works on it, and gives an output.",an:"Writing directions for a new cook who follows every word literally. If you forget a step, it simply won’t happen."},
4:{q:"What are developer tools and Git?",a:"Developer tools are the apps engineers use daily: an editor to write code, a terminal to run commands, and Git to save every version of the code and share it safely with the team.",an:"A writer’s desk: a good notebook (editor), a phone line to the printer (terminal), and a filing cabinet that keeps every draft with notes on who changed what (Git)."},
5:{q:"What is the Software Development Life Cycle (SDLC)?",a:"The SDLC is a step-by-step path that every software project follows: plan, gather requirements, design, build and test, release, then operate and improve. Following it helps teams deliver good software on time without forgetting important steps.",an:"Planning a wedding: decide the budget and date, list what the families want, design the event, arrange everything and do a rehearsal, hold the wedding, then handle thank-yous and photos afterwards."},
6:{q:"What is requirement gathering?",a:"Requirement gathering means finding out exactly what the users and business need the software to do, and writing it down clearly enough that everyone agrees and it can be tested.",an:"A tailor taking measurements and asking about the occasion before cutting cloth. Skip it, and the suit won’t fit."},
7:{q:"What is UI/UX design?",a:"UI (user interface) is how the app looks: buttons, colours, text. UX (user experience) is how it feels to use: is it easy, fast and pleasant? Designers plan both before developers build.",an:"A restaurant’s decor is the UI; how easily you find a table, order and pay is the UX."},
8:{q:"What is software architecture and system design?",a:"Architecture is the big-picture plan of a software system: which main parts it has, what each part does, and how they talk to each other. System design decides how to make it fast, reliable and secure enough.",an:"A city plan: where the roads, homes, shops and power lines go, decided before any single building is designed in detail."},
9:{q:"What is frontend web development?",a:"Frontend development is building everything you see and click in a website: the layout, buttons, forms and animations. It runs inside your browser.",an:"The front of a shop: the window display, shelves and counter that customers see and touch."},
10:{q:"What is backend development?",a:"The backend is the hidden part of an app that runs on servers. It checks logins, applies business rules, stores data and answers requests from the frontend and mobile apps.",an:"A restaurant kitchen: customers never see it, but it takes the orders, follows the recipes and sends out the food."},
11:{q:"What is a REST API?",a:"An API is a set of agreed requests one program can make to another. REST is a popular style for web APIs where each thing (like an order) has an address, and standard actions (get, create, update, delete) are used on it.",an:"A restaurant menu: it lists exactly what you can ask for and what you’ll get back. You don’t need to know how the kitchen works."},
12:{q:"What is a database?",a:"A database is an organised store of data that keeps information safe, lets many people use it at once, and finds things quickly. A relational database stores data in tables linked to each other.",an:"A well-organised library with a catalogue: every book has a place, and you can find any book in seconds."},
13:{q:"What is mobile app development?",a:"Mobile app development is building apps for Android and iOS phones. Mobile apps can use the camera, GPS and notifications, and must cope with small screens, weak networks and limited battery.",an:"Designing a food truck instead of a restaurant: same food, but everything must fit a small space, work on the move, and use little fuel."},
14:{q:"What is end-to-end integration?",a:"End-to-end integration means making all the separate parts (web app, mobile app, backend, database, background jobs, outside services) work together as one smooth system.",an:"A relay race: each runner can be fast, but the team only wins if every baton hand-off is smooth."},
15:{q:"What is software testing?",a:"Software testing is checking that the software does what it should and doesn’t do what it shouldn’t, before real users find the problems. Much of it is automated so it runs on every change.",an:"A car going through crash tests, brake tests and test drives before it is sold."},
16:{q:"What are code quality, reviews and security?",a:"Code quality means code that is easy to read and change. Code review is a teammate checking your changes before they go live. Security means protecting users’ data from attackers.",an:"A newspaper: writers follow a style guide (quality), an editor reviews every article (review), and the office has locks and ID cards (security)."},
17:{q:"What are Git, Docker and CI/CD?",a:"Git tracks code changes. Docker packages an app with everything it needs so it runs the same everywhere. CI/CD is an automatic assembly line that tests and releases every change.",an:"A factory: blueprints are version-controlled (Git), products ship in standard containers (Docker), and a conveyor belt with quality checks moves each product to the store (CI/CD)."},
18:{q:"What is cloud deployment?",a:"Deployment is putting your software on servers so real users can reach it. The cloud lets you rent those servers, databases and networks from providers like AWS, Azure or Google Cloud instead of buying hardware.",an:"Renting a fully equipped kitchen by the hour instead of building your own restaurant."},
19:{q:"What are monitoring and incident management?",a:"Monitoring is constantly watching the live system’s health through logs, numbers and alerts. Incident management is the calm, organised way a team fixes problems when something breaks in production.",an:"A hospital: monitors track patients’ vital signs all the time, and an emergency team follows a set procedure when an alarm goes off."},
20:{q:"What is generative AI and prompt engineering?",a:"Generative AI creates new text, code or images based on patterns it learned from huge amounts of data. Prompt engineering is the skill of asking it clearly so you get useful, correct results.",an:"A very well-read assistant who answers instantly but sometimes confidently makes things up, so you give clear instructions and check the work."},
21:{q:"What is AI-assisted coding?",a:"AI-assisted coding means using AI tools inside your editor to suggest code, explain code, write tests and refactor, while you stay responsible for checking every change.",an:"A driving instructor’s dual-control car: the assistance helps, but you are the driver and you are responsible."},
22:{q:"What is spec-driven development?",a:"Spec-driven development means writing down clearly what a feature must do (the specification) before building it, then letting AI or developers build it in small steps that can each be checked against the spec.",an:"An architect’s blueprint: builders (or robots) work faster and make fewer mistakes when every measurement is written down first."},
23:{q:"What are AI agents and MCP?",a:"An AI agent is an AI that can take actions (read files, run tests, open pull requests) in a loop until a task is done. MCP (Model Context Protocol) is a standard plug that connects AI apps to tools and data.",an:"An agent is like a new intern with a task list and access to some tools. MCP is like a universal power socket that lets any appliance plug into any wall."},
24:{q:"What is an AI-driven SDLC?",a:"An AI-driven SDLC uses AI as a helper in every phase (requirements, design, coding, testing, operations) while humans make decisions, approve changes and remain accountable.",an:"A modern kitchen full of smart appliances: they speed up every step, but the head chef still tastes every dish before it goes out."}

   ["What are keys and constraints?","A primary key uniquely identifies each row. A foreign key links to a row in another table. Constraints are rules the database enforces, like “email must be unique”.","Aadhaar number (unique key) and rules like “age can’t be negative” that the form simply won’t accept."],
   ["What is SQL?","SQL (Structured Query Language) is the language used to ask a relational database to store, find, change or combine data.","Asking a very precise librarian: “Show me all books by this author published after 2020, newest first.”"],
   ["What are indexes and transactions?","An index makes searching fast. A transaction groups several changes so they all succeed or all fail together.","An index is the index at the back of a book; a transaction is a bank transfer: money leaves one account only if it reaches the other."],
   ["What is data evolution?","As apps grow, the database structure must change safely (migrations), and data must be protected with backups.","Renovating a house while people still live in it: careful steps, and insurance in case something goes wrong."]],
13:[["What is native vs cross-platform development?","Native apps are built separately for Android (Kotlin) and iOS (Swift). Cross-platform apps (Flutter, React Native) use one codebase for both.","Writing a book twice in two languages (native) vs writing once and using a good translator (cross-platform)."],
   ["What is mobile navigation?","Navigation is how users move between screens: tabs at the bottom, screens stacking on top of each other, and the back button.","Rooms in a house: hallways (tabs) connect main rooms, and you retrace your steps to go back."],
   ["What is the app lifecycle?","The phone’s operating system starts, pauses, sends to background and closes apps to save battery. Apps must save and restore their state.","A waiter putting your half-finished plate aside when you step out, and bringing it back when you return."],
   ["What are device capabilities?","Phones offer camera, GPS, notifications and fingerprint login. Apps must ask permission and still work if the user says no.","Asking a guest before borrowing their phone charger, and having a plan if they say no."],
   ["What are offline support and app releases?","Offline support keeps the app useful without internet by saving data on the phone. Releases go through app stores, which review apps before users get them.","A paper notebook you can use anywhere and copy into the office system later. Releases are like a new book passing the publisher’s checks before reaching shops."]],
14:[["What is a shared backend?","One backend serves every client (website, Android, iOS, admin panel) through the same APIs, so the logic is written once.","One central kitchen supplying several branches of a restaurant chain."],
   ["Why keep business rules on the server?","Anything on a user’s phone can be changed by the user. Prices, discounts and permissions must be checked on the server, which users can’t tamper with.","The cashier rings up prices at the counter; you don’t get to write your own bill."],
   ["What is data consistency?","Consistency means the data always makes sense: no order without items, no status jumping from “placed” to “delivered” without the steps in between.","A train ticket booking system that never sells the same seat twice."],
   ["What are asynchronous services?","Async services handle follow-up work through queues and events (SMS, emails, rider assignment) so the main flow stays fast.","After a sale, the shop’s back office handles invoicing and delivery while the cashier serves the next customer."],
   ["What are quality attributes?","Quality attributes are the overall properties of the whole system: speed, security, ability to grow, and how easily problems can be found.","A good train service: on time, safe, can add coaches at festival time, and has a control room watching every train."]],
15:[["What is unit testing?","A unit test checks one small piece of code (like one function) on its own, very quickly.","Testing each light bulb before installing it in the chandelier."],
   ["What is integration testing?","Integration testing checks that several parts work correctly together, like code and the real database.","Checking that the bulbs, wiring and switch work together once installed."],
   ["What is end-to-end (E2E) testing?","An E2E test uses the app like a real user would, through the actual screens, from start to finish.","A mystery shopper who visits, orders, pays and reports on the whole experience."],
   ["What is negative testing?","Negative testing checks how the app handles wrong, missing or extreme inputs, which is where many bugs hide.","Testing a lock by trying the wrong key, no key, and forcing it, not just the right key."],
   ["What is test automation?","Automation means tests are written as code and run by computers automatically on every change.","A smoke detector that checks the air all the time, instead of someone sniffing for smoke once a day."]],
16:[["What is readable code?","Readable code is code that other people (and future you) can understand quickly: clear names, small functions, consistent style.","Neat handwriting with headings and paragraphs vs a scribbled note only the writer can read."],
   ["What is a code review?","A code review is a teammate reading your changes before they are merged, to catch mistakes and share knowledge.","A second pair of eyes proofreading an important letter before it is sent."],
   ["What is secure coding?","Secure coding means writing code that attackers can’t trick, for example by never trusting user input and always checking permissions.","A bank teller who checks ID and signatures every time, even for regular customers."],
   ["What are secrets and least privilege?","Secrets are passwords and keys that unlock systems. Least privilege means giving each person or program only the access it truly needs.","Giving the plumber a key to the bathroom only, not to the whole house."],
   ["What is security scanning?","Security scanning uses automatic tools to check code and libraries for known weaknesses before they reach users.","An airport X-ray scanner checking every bag automatically."]],
17:[["What is Git collaboration?","Git collaboration is the team’s agreed way of branching, reviewing and merging code so many people can work on the same project safely.","Many authors writing chapters of one book, with an editor merging approved chapters."],
   ["What is Continuous Integration (CI)?","CI automatically builds and tests the code every time someone pushes a change, giving feedback within minutes.","A spell-checker that checks every page the moment you finish typing it."],
   ["What is Docker?","Docker packages an app together with everything it needs to run into a container image, so it behaves the same on any machine.","A packed lunch box: the meal, packed with everything needed, tastes the same wherever you open it."],
   ["What is Continuous Delivery (CD)?","CD automatically moves tested code through environments (testing, staging) so it can be released to users at any time, safely.","A conveyor belt carrying finished, quality-checked products straight to the shop shelves."],
   ["What is rollback?","Rollback means quickly going back to the previous working version when a new release causes problems.","The undo button, for a whole website."]],
18:[["What are cloud resources?","Cloud resources are computing power, storage, databases and networks you rent from a cloud provider and pay for as you use them.","Electricity from the grid: you don’t own a power plant, you just pay for the units you use."],
   ["What is hosting?","Hosting is where and how your app runs: on a rented virtual machine, in containers, on a platform that runs your code for you, or as small functions that run only when needed.","Places to sell food: rent an empty shop (VM), a food-court stall (PaaS), or a pop-up that opens only when there are customers (serverless)."],
   ["What is cloud networking?","Networking controls how traffic reaches your app and which parts can talk to each other: addresses, secure HTTPS, firewalls and load balancers.","A gated community: one main gate with security (load balancer, firewall), and internal roads only residents can use."],
   ["What are managed services?","Managed services are cloud tools (databases, queues) that the provider sets up, updates, backs up and repairs for you.","A serviced apartment: cleaning, repairs and security are handled for you."],
   ["What is mobile app delivery?","Mobile delivery is getting an app onto phones: signing it, testing it with a small group, passing app store review, then releasing gradually.","Launching a new product in a few cities first before going nationwide."]],
19:[["What are logs?","Logs are timestamped notes the app writes about what it is doing, used to understand what happened when something goes wrong.","An aircraft’s black box recording everything during the flight."],
   ["What are metrics?","Metrics are numbers tracked over time (speed, error rate, traffic) and shown on dashboards to see the system’s health at a glance.","A car dashboard: speed, fuel and engine temperature."],
   ["What is tracing?","Tracing follows a single request through every part of the system and shows where time was spent.","A courier tracking page showing every hub a parcel passed through and how long it waited at each."],
   ["What is incident response?","Incident response is the organised way a team reacts when production breaks: detect, limit the damage, fix, and learn from it.","A fire drill: everyone knows their role, so the response is calm and fast."],
   ["What is operations and maintenance?","Operations keeps the system healthy day to day: scaling for busy times, backups, security updates and cost control.","Regular servicing of a car: oil changes, tyre checks and repairs before they become breakdowns."]],
20:[["What is generative AI?","Generative AI is a type of AI that creates new content (text, code, images) based on patterns learned from huge amounts of examples.","A musician who has heard thousands of songs and can compose a new one in any style."],
   ["What is an LLM?","A Large Language Model reads and writes text by predicting the most likely next word-piece (token), one at a time, based on everything before it.","Your phone’s keyboard suggestions, but enormously more powerful and able to write whole programs."],
   ["What is a prompt?","A prompt is the instruction you give the AI. A good prompt states the task, gives context, sets limits and shows the format you want.","Giving a new assistant a clear brief instead of “do something about the report”."],
   ["What is AI hallucination?","A hallucination is when AI confidently gives wrong or invented information, such as a function that doesn’t exist.","A confident tourist guide who makes up a story when they don’t know the answer."],
   ["Why does privacy matter with AI tools?","Whatever you paste into an AI tool may leave your company. Passwords, customer data and confidential code must not be shared with unapproved tools.","You wouldn’t read out a customer’s bank details on a public phone call."]],
21:[["What is an AI coding copilot?","A copilot is an AI built into your code editor that suggests code as you type, answers questions and can make changes for you to review.","A co-pilot in a plane: helpful, alert, but the captain is in charge."],
   ["What is repository context?","Repository context is the project information (files, rules, conventions) given to the AI so its suggestions fit your codebase.","Briefing a new team member about how things are done here before they start."],
   ["What is refactoring?","Refactoring means improving the structure of code without changing what it does.","Reorganising a messy cupboard: everything is still there, just easier to find."],
   ["How does AI help with tests and docs?","AI can quickly draft test cases and documentation; you check that they are correct and actually test the right things.","A helper who drafts the meeting minutes; you still read them before sending."],
   ["What is verification of AI code?","Verification means reading every AI-generated change, running the tests and checking security before accepting it.","Checking a delivery against the order slip before signing for it."]],
22:[["What is a requirement specification?","A specification is a clear written description of what a feature must do, with numbered rules and examples.","A detailed cake order: flavour, size, message, delivery time, nothing left to guess."],
   ["What is a technical plan?","A technical plan explains how the team will build the spec: data changes, APIs, components, risks and testing.","The baker’s plan: which tins, oven temperature, order of steps."],
   ["What is task breakdown?","Task breakdown splits the plan into small steps, each one finishable and checkable on its own.","Breaking “clean the house” into “sweep kitchen”, “wash dishes”, “dust shelves”."],
   ["What is AI implementation in spec-driven work?","AI writes the code one small task at a time, following the spec and plan, and each result is checked before moving on.","A machine on an assembly line following a precise drawing for each part."],
   ["What is traceability?","Traceability links each requirement to the code and tests that implement it, so you can prove everything is covered.","A receipt that matches every item in your shopping bag to the price you paid."]],
23:[["What is an AI agent?","An AI agent is an AI that works towards a goal by repeatedly planning, using tools, checking results and deciding the next step.","A personal assistant who is told “book my trip” and handles the steps, checking back on important decisions."],
   ["What is tool calling?","Tool calling lets an AI ask your program to run a specific, pre-defined action (like “run tests”) and get the result back.","A manager asking the accounts team for a report: they can request it, but the accounts team actually produces it."],
   ["What is MCP?","MCP (Model Context Protocol) is a standard way to connect AI applications to tools and data sources, so one connector works with many AI apps.","USB: any device with a USB plug works with any computer that has a USB port."],
   ["What are control boundaries for agents?","Control boundaries limit what an agent can do: which tools, which data, which actions need human approval.","A trainee’s access card: some rooms open freely, some need a supervisor."],
   ["What are evaluations (evals)?","Evals are test sets for AI behaviour: realistic tasks with known correct results, used to measure how reliable an agent is.","A driving test with fixed routes and checkpoints, before you get a licence."]],
24:[["How does AI help with requirements?","AI turns messy notes and tickets into draft user stories and acceptance criteria; the product owner reviews and approves them.","An assistant who organises a pile of customer letters into a neat summary for the manager to decide on."],
   ["How does AI help with architecture?","AI lists design options and their pros and cons; architects check them against real constraints and decide.","Getting three quotes for a renovation and having someone list the pros and cons, but you choose."],
   ["How does AI help with implementation?","AI writes code task by task within the project’s rules, and every change goes through normal review and testing.","A fast junior developer whose work is always reviewed."],
   ["How does AI help with QA and CI?","AI drafts test cases and data, but independent checks (automated tests, scanners, human testers) decide whether code passes.","A student can make practice questions, but the exam is set and marked by someone else."],
   ["What is AI governance?","Governance sets the rules for AI use: who approves what, how AI help is recorded, and extra care for sensitive areas like payments and personal data.","Hospital rules for new equipment: approved devices, trained staff, records of use, and a doctor signs off every decision."]]
};

  {t:"8. OAuth 2.0: granting access without sharing passwords", d:"<b>In simple words:</b> OAuth lets one application act on your behalf in another application <b>without you giving it your password</b>. Instead, after you agree on a consent screen, the second application issues an <b>access token</b> with limited permissions (<b>scopes</b>) and an expiry. <b>Think of it like</b> a valet key: it lets the valet drive your car, but not open the boot. <b>OAuth 2.0</b> replaced OAuth 1.0 because it is simpler and faster to implement (it relies on HTTPS instead of complex request signing) and supports web, mobile and server apps. It defines four roles: the <b>resource owner</b> (the user), the <b>client</b> (the app asking for access), the <b>authorization server</b> (issues tokens) and the <b>resource server</b> (the API holding the data).",

  {t:"9. OpenID Connect and JWT", d:"<b>OAuth 2.0 is about authorization</b> (access to APIs). It doesn’t, by itself, tell the app <i>who</i> the user is. <b>OpenID Connect (OIDC)</b> is a thin identity layer on top of OAuth 2.0 that adds <b>authentication</b>: along with the access token, the app receives an <b>ID token</b> describing the user (id, name, email). “Sign in with Google / Microsoft / Apple” buttons use OpenID Connect. Both tokens are commonly <b>JSON Web Tokens (JWT)</b>: a compact, signed JSON format that any service can verify without calling back to the issuer.",

  const OBS = [
  {t:"Observability 1. What is observability?", d:"<b>Observability platforms</b> provide a <b>centralized way to collect, store, analyse and visualise logs, metrics and traces</b>. They give a connected, real-time view of all the operational data in a software system, and the flexibility to <b>ask new questions</b> about applications and infrastructure, so the team can understand system behaviour and find the answers needed to improve performance and fix problems. <b>In simple words:</b> monitoring tells you <i>that</i> something is wrong; observability helps you find out <i>why</i>, even for problems nobody predicted. <b>Think of it like</b> a doctor: a thermometer (monitoring) says you have a fever; blood tests, scans and your history (observability) reveal the cause.",
   dg:["The capabilities that together make a system observable.", HB(["Observability","understand the system from its data"],[["Monitoring","known health checks, dashboards"],["Logging","what happened, in detail"],["Tracing","the path of each request"],["Visualization","dashboards, graphs, maps"],["Alerting","notify humans to act"],["Metrics","numbers over time"]],{h:340})],
   tb:{head:["","Monitoring","Observability"], rows:[["Question it answers","Is something wrong? (known questions)","Why is it wrong? (new, unexpected questions)"],["Approach","Pre-defined dashboards and thresholds","Rich, connected data you can explore freely"],["Example","Alert: error rate above 2%","“Why are only UPI payments from one bank slow since 1 p.m.?”"],["Relationship","A part of observability","Monitoring + logs + metrics + traces + exploration"]]}},

  {t:"Observability 2. Why it gets harder as systems grow", d:"How much observability you need depends on how your system is built. With <b>one service on one server</b>, you can open its log file and usually see the error. With <b>one service on many servers</b> (behind a load balancer), the error could be in any of them, so you must <b>aggregate</b> host-level metrics and logs and still be able to <b>drill down</b> to one machine. With <b>many services on many servers</b> (microservices), a single user action touches several services, so aggregation of metrics and logs plays a vital part, and you need <b>tracing</b> to connect the pieces.",

  {t:"Observability 3. Building blocks: what observability must achieve", d:"Whatever tools you choose, observability exists to reach three goals. <b>1. Know that users are happy</b>, and if there is a problem, know about it, <b>ideally before users find it themselves</b>. <b>2. When a problem occurs, get the system up and running again</b> quickly. <b>3. Have enough information to work out what went wrong</b>, and what to do so it doesn’t happen again.",
   dg:["The observability loop.", F([["Detect","metrics, alerts, synthetic tests","before users notice"],["Diagnose","dashboards → traces → logs","find where & why"],["Restore","rollback, scale, feature flag off","users happy again"],["Learn & prevent","post-mortem, new alerts/tests","avoid repeats"]],{w:170,loop:"continuous improvement"})]},

  {t:"Observability 4. MELT: Metrics, Events, Logs, Traces", d:"<b>MELT</b> is a handy way to remember the four kinds of telemetry data. <b>Metrics, logs and traces</b> are often called the <b>three pillars of observability</b>; <b>events</b> (discrete, important happenings) are the fourth. Each answers a different question, and real investigations move between them. The three aggregation practices built on them are <b>log aggregation</b> (collecting logs across all services), <b>metrics aggregation</b> (capturing numbers from services and infrastructure to detect problems, plan capacity and auto-scale) and <b>distributed tracing</b> (following calls across service boundaries to see what went wrong and get accurate latency).",
   dg:["The four types of telemetry.", C([{t:"Metrics",s:"numbers over time",items:["Error rate 3.1%","p95 latency 1.2 s","CPU 85%","Cheap to store, great for alerts"]},{t:"Events",s:"important moments",items:["Deploy v3.2.1 at 12:55","Config changed","Autoscaled 3 → 6 pods","Explain sudden changes"]},{t:"Logs",s:"detailed messages",items:["ERROR payment webhook signature invalid","Full context per request","Answer “what exactly happened?”"]},{t:"Traces",s:"path of one request",items:["Gateway → Orders → Payments","Time spent in each step","Answer “where is it slow?”"]}])]},

   dg:["From alert to root cause.", F([["Metric alert","checkout errors 8%"],["Event","deploy at 12:55?"],["Trace","failing span: payment service"],["Logs","“amount in rupees, expected paise”"],["Fix","rollback, then patch"]])]},

  {t:"Observability 5. Log aggregation", d:"Logs quickly become one of the <b>most vital mechanisms</b> for understanding what is happening in production, yet the log format, what fields we put in, and how we treat logs are often an afterthought. With many services on many servers, nobody can log in to each machine and read files. <b>Log aggregation</b> ships every log line to one central, searchable store. Three things make aggregated logs useful. A <b>common format</b>: every service logs the same fields in the same structure, so you can run queries across all of them. <b>Correlating log lines</b>: one user action triggers many downstream calls, so a shared <b>correlation (request) ID</b> links them. <b>Timing</b>: clocks on different machines drift, so log order across hosts can mislead you; use synchronised clocks (NTP), timestamps in UTC, and tracing for exact ordering.",
   dg:["A popular open-source log aggregation pipeline (the EFK stack).", F([["Services","Order, Payment, Menu"],["Forwarding agent","Fluentd / Fluent Bit"],["Elasticsearch","index & store"],["Kibana","search, slice, dashboards"],["Alerts","error spikes"]])],

  {t:"Metrics aggregation: seeing the whole system in numbers", d:"Reading logs from many hosts doesn’t scale, so we also gather <b>numbers</b> about our systems and aggregate them: per instance, per service, per region, for the whole system. The hard part is knowing what <b>“good” looks like</b>. Is this a problem: “the website is seeing nearly 50 4XX errors per second” or “CPU load on the catalogue service has risen 20% since lunch”? You can only tell by comparing with a <b>baseline</b> (the same time last week, normal traffic patterns) and with <b>business metrics</b> (are orders per minute normal?). Aggregated metrics also drive <b>capacity planning</b> and <b>auto-scaling</b>.",
   dg:["How metrics are collected and used (Prometheus-style).", F([["Services & hosts","expose /metrics"],["Prometheus","scrapes every 15 s"],["Time-series DB","stores numbers + labels"],["Grafana","dashboards & drill-down"],["Alertmanager / autoscaler","notify or scale"]])],
   tb:{head:["Signal","Is this bad?","How to decide"], rows:[["50 4XX errors per second","Maybe not","Normal is 45–55/s at lunch? Fine. Normal is 5/s? Investigate (bad client release, bot traffic)"],["Catalogue CPU +20% since lunch","Maybe not","Lunch traffic is 3× higher, so +20% CPU is healthy. If traffic is flat, look for a slow query or a bug"],["Orders per minute −40%","Very likely","Business metric drop with normal traffic usually means users are failing to order"]]}},
  {t:"Low vs high cardinality", d:"<b>Cardinality</b> is the number of <b>distinct values</b> a label (dimension) can have. <code>status_code</code> has low cardinality (a handful of values); <code>customer_id</code> or <code>request_id</code> has very high cardinality (millions). In metric systems, every unique combination of label values becomes a separate time series, so the more labels you add and the more values each has, the more data the system must store and the slower and costlier it gets. Older metric tools struggle with high cardinality; newer observability tools (and traces/logs) are built to store and query it. Rule of thumb: keep <b>metrics</b> low-cardinality (service, endpoint, status, region) and put high-cardinality details (customer ID, request ID, product ID, build number) in <b>logs and traces</b>.",

  {t:"Distributed tracing: following one request across services", d:"A microservice architecture is a set of processes that work together to carry out a task, so one click can travel through many services. <b>Distributed tracing</b> observes requests as they propagate through such a distributed environment. The first service (the edge, e.g. the API gateway) tags the interaction with a <b>unique trace ID</b>, and that ID plus some <b>context</b> is passed along with every downstream call. Each unit of work records a <b>span</b>: which service, what operation, start time, duration, success or error, and its parent span. Together, all spans with the same trace ID form the <b>trace</b>: a tree of calls and a timeline of where the time went.",

  {t:"What happened to my request? Without and with tracing", d:"In a large system with dozens of services connected in every direction, logs and metrics tell you that something is slow or failing, but not <b>which path</b> one particular request took. Distributed tracing draws exactly that path. Common tools: <b>OpenTelemetry</b> (the open standard for instrumenting code), with <b>Jaeger</b>, <b>Zipkin</b> or <b>Grafana Tempo</b> as storage and viewers, or commercial APM tools like Datadog, New Relic, Dynatrace and AWS X-Ray.",

   code:["js",`// OpenTelemetry auto-instrumentation for a Node.js service (tracing.js, loaded first)
const { NodeSDK } = require("@opentelemetry/sdk-node");
const { getNodeAutoInstrumentations } = require("@opentelemetry/auto-instrumentations-node");
const { OTLPTraceExporter } = require("@opentelemetry/exporter-trace-otlp-http");

new NodeSDK({

}).start();

  {t:"Semantic (synthetic) monitoring", d:"Monitoring of web applications falls into two categories. <b>Passive monitoring</b> watches <b>real user traffic</b> as it happens (logins, clicks, page hits, server transactions), also called real-user monitoring (RUM). <b>Active monitoring</b> generates its <b>own test traffic</b> on a schedule. <b>Semantic monitoring</b> (also known as <b>synthetic monitoring</b>) is an active approach that runs <b>a chunk of the application’s automated tests against the live production system</b> at regular intervals, and sends the results to the monitoring service, which alerts when anything goes wrong. It combines automated testing with monitoring to catch <b>business requirements that are not being met in production</b>, even at 3 a.m. when there are no real users to notice.",
   dg:["A synthetic checkout test running against production every 5 minutes.", F([["Scheduler","every 5 min, 3 regions"],["Synthetic journey","login → search → add → pay (test card)"],["Check results","status, timings, “Order confirmed” shown"],["Monitoring service","dashboards & history"],["Alert if failed","page on-call"]])],
   tb:{head:["Type of semantic monitoring","Checks","Tiny example"], rows:[["Availability (uptime) monitoring","Is the site / service up and reachable?","GET https://www.example.com/health returns 200 from 3 regions"],["Performance monitoring","Page load speed, backend response times","Menu page loads in under 2 s; API p95 under 500 ms"],["Transaction monitoring","Does a full business transaction work end to end?","Test customer can log in, add a dish, pay with a test card and see confirmation"]]},
   code:["ts",`// A synthetic transaction (Playwright), run every 5 minutes against production
test("checkout works in production", async ({ page }) => {
  await page.goto("https://www.example.com");
  await loginAsSyntheticUser(page);                  // dedicated test account, flagged in analytics
  await page.getByRole("searchbox").fill("dosa");
  await page.getByTestId("dish-101").getByRole("button", { name: "Add" }).click();
  await page.getByRole("button", { name: /Pay/ }).click();
  await payWithTestCard(page);                       // payment provider's test mode, no real charge
  await expect(page.getByText("Order confirmed")).toBeVisible({ timeout: 10000 });
});`,"Synthetic transaction test"]}
  ];

  /* ---------- Sub-topic 4: alerting + testing in production ---------- */
  const ALR = [
  {t:"Alerting: when a human must act", d:"Sooner or later something happens that requires a <b>human operator to be notified and take action</b>: a microservice becomes unavailable, errors are higher than expected, latency breaks the SLO. Good alerting is a balance. Too few alerts and users find problems first; too many and people start ignoring them (<b>alert fatigue</b>). Principles: alert on <b>symptoms users feel</b> (errors, latency, failed transactions) rather than every internal signal; make every alert <b>actionable</b> with a link to a runbook; route by <b>severity</b> (page at night only for SEV-1/2, otherwise a ticket or chat message); require the condition to last a few minutes to avoid noise.",
   dg:["From a metric to the right person.", F([["Metric crosses threshold","error rate > 2%"],["Lasts “for: 5m”","avoid flapping"],["Alertmanager","group, deduplicate"],["Route by severity","critical → page, warning → chat"],["On-call acts","runbook link"]])],
   code:["yaml",`# Prometheus alerting rule
groups:

        labels: { severity: critical, team: checkout }
        annotations:
          summary: "Checkout 5xx error rate above 2%"
          runbook: "https://wiki.example.com/runbooks/checkout-errors"`,"An actionable alert rule"]},

  {t:"Testing in production", d:"All forms of <b>testing in production</b> are arguably a kind of monitoring: we run them in the live system to make sure it behaves as we expect, and many of them catch problems <b>before users notice</b>. They complement, not replace, testing before release. Five common techniques:",
