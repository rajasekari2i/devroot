<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Software Engineering Foundation: SDLC for Web & Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>:root{
  --fd:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --fb:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --fm:ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E9EDF2; --ink:#16202C; --ink-2:#4B5766; --line:#D6DDE5; --line-strong:#8E9BAA;
  --p1:#2459D6; --p2:#0B8A60; --p3:#B87905; --p4:#0A7896; --p5:#6D43CF;
  --on-p1:#fff; --on-p2:#fff; --on-p3:#1A1200; --on-p4:#fff; --on-p5:#fff;
  --ok:#0B8A60; --warn:#C93453;
  --code-bg:#141B24; --code-head:#1E2834; --code-ink:#E4EAF1; --code-cmt:#8D9BAC; --code-kw:#9CC2FF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141B; --surface:#171E27; --surface-2:#212A35; --ink:#E7ECF2; --ink-2:#A2AEBC; --line:#2B3644; --line-strong:#5A6878;
    --p1:#7AA3FF; --p2:#3CC796; --p3:#F0B940; --p4:#4CC6E8; --p5:#AD90FF;
    --on-p1:#0F141B; --on-p2:#0F141B; --on-p3:#0F141B; --on-p4:#0F141B; --on-p5:#0F141B;
    --ok:#3CC796; --warn:#FF7A93; --code-bg:#0A0E13; --code-head:#151C25;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#171E27; --surface-2:#212A35; --ink:#E7ECF2; --ink-2:#A2AEBC; --line:#2B3644; --line-strong:#5A6878;
  --p1:#7AA3FF; --p2:#3CC796; --p3:#F0B940; --p4:#4CC6E8; --p5:#AD90FF;
  --on-p1:#0F141B; --on-p2:#0F141B; --on-p3:#0F141B; --on-p4:#0F141B; --on-p5:#0F141B;
  --ok:#3CC796; --warn:#FF7A93; --code-bg:#0A0E13; --code-head:#151C25;
  color-scheme: dark;
}
:root{
  --p1-soft:color-mix(in srgb, var(--p1) 13%, var(--surface)); --p2-soft:color-mix(in srgb, var(--p2) 13%, var(--surface));
  --p3-soft:color-mix(in srgb, var(--p3) 15%, var(--surface)); --p4-soft:color-mix(in srgb, var(--p4) 13%, var(--surface));
  --p5-soft:color-mix(in srgb, var(--p5) 13%, var(--surface));
  --ok-soft:color-mix(in srgb, var(--ok) 15%, var(--surface)); --warn-soft:color-mix(in srgb, var(--warn) 14%, var(--surface));
  --pc:var(--p1); --on-pc:var(--on-p1); --pc-soft:var(--p1-soft);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--fb);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--pc);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--fd);letter-spacing:-.015em;line-height:1.15}
code{font-family:var(--fm);font-size:.9em;background:var(--surface-2);padding:.1em .35em;border-radius:5px}
img,svg{max-width:100%}

/* shell */
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 18px;display:flex;flex-direction:column;gap:14px}
main{padding:32px clamp(16px,3.6vw,52px) 90px;max-width:1160px;width:100%;overflow-x:clip}
.topbar{display:none}
.brand{display:flex;gap:12px;align-items:center;text-decoration:none;padding:0 6px}
.brand b{display:block;font-family:var(--fd);font-size:1.02rem;line-height:1.2}
.brand small{color:var(--ink-2);font-size:.82rem}
.brand-mark{flex:none;width:34px;height:34px;border-radius:50%;border:6px solid var(--p1);background:var(--surface);box-shadow:10px 0 0 -4px var(--p5)}
.progress{padding:0 6px;font-size:.82rem;color:var(--ink-2)}
.progress .bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-bottom:4px}
.progress .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p1),var(--p2),var(--p3),var(--p4),var(--p5));transition:width .4s}
#nav{flex:1}
.nav-home{display:block;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:600}
.nav-home[aria-current]{background:var(--surface-2)}
.nav-phase{margin-top:12px}
.nav-ph{display:block;padding:6px 10px;border-radius:8px;text-decoration:none;font-family:var(--fd);font-weight:700;color:var(--pc);line-height:1.25}
.nav-ph[aria-current]{background:var(--surface-2)}
.nav-pn{display:block;font-family:var(--fb);font-weight:500;font-size:.78rem;color:var(--ink-2)}
.nav-st{list-style:none;margin:2px 0 0;padding:0}
.nav-st a{position:relative;display:grid;grid-template-columns:26px 22px 1fr;align-items:center;padding:5px 8px 5px 6px;text-decoration:none;color:var(--ink-2);font-size:.88rem;line-height:1.3;border-radius:8px}
.nav-st a::before{content:"";position:absolute;left:19px;top:0;bottom:0;width:4px;background:var(--pc)}
.nav-st li:first-child a::before{top:50%}
.nav-st li:last-child a::before{bottom:50%}
.dot{position:relative;z-index:1;justify-self:center;width:13px;height:13px;border-radius:50%;border:3px solid var(--pc);background:var(--surface);margin-left:1px}
.nav-num{font-variant-numeric:tabular-nums;font-size:.78rem}
.nav-st a.is-done .dot{background:var(--pc)}
.nav-st a[aria-current]{background:var(--surface-2);color:var(--ink);font-weight:600}
.nav-st a[aria-current] .dot{width:17px;height:17px;border-width:4px}
.nav-st a:hover{color:var(--ink)}
.side-foot{display:flex;gap:8px;flex-wrap:wrap;padding:10px 6px 0;border-top:1px solid var(--line)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);font:600 .95rem/1.3 var(--fb);text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--pc)}
.btn.pri{background:var(--pc);border-color:var(--pc);color:var(--on-pc)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:7px 12px;font-size:.88rem}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.15rem;cursor:pointer}
.linkbtn{background:none;border:0;padding:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer}
kbd{font-family:var(--fm);font-size:.82em;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:.05em .4em;background:var(--surface)}

/* common */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
.card h2{font-size:1.25rem;margin:0 0 12px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.crumb{margin:0 0 18px;font-size:.92rem}
.crumb a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line-strong)}
.crumb a:hover{color:var(--ink)}
.lede{font-size:1.22rem;line-height:1.5;max-width:60ch;margin:18px 0 0}

/* home */
.hero{padding:10px 0 4px}
.hero-t{font-size:clamp(2.4rem,6vw,4.3rem);line-height:1.02;letter-spacing:-.035em;max-width:15ch;margin:0;font-weight:800}
.hero-s{font-size:1.2rem;color:var(--ink-2);max-width:58ch;margin:18px 0 22px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.map-wrap{margin-top:32px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 10px 4px}
.metro{display:block;width:100%;min-width:700px;height:auto}
.map-hint{margin:0 12px 10px;color:var(--ink-2);font-size:.9rem}
.mline{fill:none;stroke-width:9;stroke-linecap:round;stroke-dasharray:1300;stroke-dashoffset:1300;animation:draw 1.1s cubic-bezier(.5,0,.2,1) forwards}
.mline:nth-child(2){animation-delay:.25s}.mline:nth-child(3){animation-delay:.5s}.mline:nth-child(4){animation-delay:.75s}.mline:nth-child(5){animation-delay:1s}
@keyframes draw{to{stroke-dashoffset:0}}
.mdot{fill:var(--surface);stroke-width:5;transition:stroke-width .15s}
.mnum{font:700 12px var(--fb);fill:var(--ink)}
.mlab{font:500 12.5px var(--fb);fill:var(--ink-2)}
.mphase text{font:700 15px var(--fd)}
.mst{cursor:pointer}
.mst:hover .mdot,.mst:focus-visible .mdot{stroke-width:8}
.mst:hover .mlab{fill:var(--ink)}
.mst:focus-visible{outline:none}
.intro-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;margin-top:24px}
.intro-grid > div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
.intro-grid h2{font-size:1.35rem;margin:0 0 10px}
.intro-grid .dg{min-width:560px !important}
.rhythm{margin:0;padding-left:1.3em;font-size:.95rem}
.rhythm li{break-inside:avoid;margin-bottom:4px}
.keys{font-size:.92rem;color:var(--ink-2);margin-bottom:0}
.phase-list{margin-top:40px}
.phase-list h2{font-size:1.6rem;margin:0 0 16px}
.pcard{display:flex;gap:18px;align-items:flex-start;padding:20px 22px;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--pc);border-radius:16px;text-decoration:none;margin-bottom:12px}
.pcard:hover{border-color:var(--pc)}
.pcard-n{flex:none;width:48px;height:48px;border-radius:50%;background:var(--pc);color:var(--on-pc);display:grid;place-items:center;font:800 1.4rem var(--fd)}
.pcard-t{display:block;font:700 1.25rem/1.25 var(--fd)}
.pcard-i{display:block;margin-top:4px}
.pcard-s{display:block;margin-top:6px;font-size:.88rem;color:var(--ink-2)}

/* phase page */
.ph-band{display:flex;gap:22px;align-items:center}
.ph-big{flex:none;width:92px;height:92px;border-radius:50%;background:var(--pc);color:var(--on-pc);display:grid;place-items:center;font:800 3rem var(--fd)}
.ph-label{margin:0;color:var(--ink-2)}
.ph-band h1,.s-title h1{font-size:clamp(2rem,4.4vw,3.1rem);margin:0;font-weight:800;letter-spacing:-.03em}
.ph-stations{list-style:none;padding:0;margin:34px 0;position:relative}
.ph-stations::before{content:"";position:absolute;left:18px;top:24px;bottom:24px;width:6px;background:var(--pc);border-radius:3px}
.ph-stations a{position:relative;display:flex;gap:18px;padding:10px 12px 10px 0;text-decoration:none;border-radius:12px}
.ph-stations a:hover .ph-st{text-decoration:underline}
.ph-dot{flex:none;z-index:1;width:42px;height:42px;border-radius:50%;border:6px solid var(--pc);background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.ph-stations a.is-done .ph-dot{background:var(--pc);color:var(--on-pc)}
.ph-st{display:block;font:700 1.15rem/1.3 var(--fd);margin-top:2px}
.ph-tag{display:block;color:var(--ink-2);max-width:68ch}
.ph-cols{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-bottom:28px}
.ticks{list-style:none;padding:0;margin:0}
.ticks li{position:relative;padding-left:28px;margin-bottom:10px}
.ticks li::before{content:"✓";position:absolute;left:2px;color:var(--ok);font-weight:800}
.discuss{background:var(--pc-soft);border-color:transparent}

/* session */
.s-title{display:flex;gap:20px;align-items:center}
.s-num{position:relative;flex:none;width:76px;height:76px;border-radius:50%;border:8px solid var(--pc);background:var(--surface);display:grid;place-items:center;font:800 1.7rem var(--fd)}
.s-num::before{content:"";position:absolute;right:100%;top:50%;width:60vw;height:8px;margin-right:4px;background:var(--pc);transform:translateY(-50%)}
.s-of{margin:0;color:var(--ink-2)}
.why{max-width:72ch;margin:22px 0 0;background:var(--surface);border-left:5px solid var(--pc);padding:14px 20px;border-radius:0 12px 12px 0}
.blk{margin-top:52px}
.blk > h2{font-size:1.5rem;margin:0 0 16px}
.fig{margin:0 0 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 20px 14px}
.fig figcaption{margin-top:10px;color:var(--ink-2);font-size:.92rem}

.concepts{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:18px;align-items:start}
.ctabs{display:flex;flex-direction:column;gap:6px}
.ctab{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;text-align:left;padding:12px 14px;border:1.5px solid transparent;border-radius:12px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.ctab:hover{background:var(--surface)}
.ctab[aria-selected="true"]{background:var(--surface);border-color:var(--pc)}
.ctn{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--pc);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.ctab[aria-selected="true"] .ctn{background:var(--pc);color:var(--on-pc)}
.ctt{display:block;font-weight:650;line-height:1.3}
.cts{display:block;font-size:.85rem;color:var(--ink-2);line-height:1.35;margin-top:2px}
.cpanel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 30px;min-height:100%}
.cpanel h3{font-size:1.6rem;margin:0}
.cpanel .cs{color:var(--ink-2);margin:4px 0 14px}
.cpanel p{max-width:68ch}
.ex{margin-top:18px;background:var(--pc-soft);border-radius:12px;padding:14px 18px}
.ex-l{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.88rem}
.ex-l::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--pc)}
.ex p{margin:4px 0 0}

.flow{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 24px 22px}
.flow-track{position:absolute;top:calc(26px + 22px - 3px);left:calc(24px + (100% - 48px) / 8);right:calc(24px + (100% - 48px) / 8);height:6px;border-radius:3px;background:var(--line)}
.flow-fill{display:block;height:100%;width:0;border-radius:3px;background:var(--pc);transition:width .5s ease}
.flow-steps{position:relative;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr)}
.fstep{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;background:none;border:0;padding:0 4px;color:var(--ink-2);font:inherit;cursor:pointer}
.fdot{width:44px;height:44px;border-radius:50%;border:5px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;font:800 1rem var(--fd);color:var(--ink);transition:transform .2s, background .2s}
.fstep.past .fdot{border-color:var(--pc)}
.fstep.on .fdot{border-color:var(--pc);background:var(--pc);color:var(--on-pc);transform:scale(1.12)}
.ft{font-weight:650;text-align:center;line-height:1.25;font-size:.95rem}
.fstep.on .ft{color:var(--ink)}
.flow-detail{margin-top:20px;background:var(--pc-soft);border-radius:12px;padding:16px 20px;min-height:96px}
.flow-detail p{margin:0;max-width:72ch}
.fd-h{font-weight:700;margin-bottom:4px !important}
.flow-ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:.95rem}
.tbl th,.tbl td{padding:11px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl thead th{background:var(--surface-2);font-weight:700}
.tbl tbody th{font-weight:600}
.tbl tr:last-child > *{border-bottom:0}

.code{margin:0;background:var(--code-bg);border-radius:16px;overflow:hidden}
.code figcaption{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px 10px 18px;background:var(--code-head);color:var(--code-ink);font-size:.9rem}
.code .btn{background:transparent;color:var(--code-ink);border-color:#56657a}
.code pre{margin:0;padding:18px 20px;overflow:auto;max-height:560px}
.code code{background:none;padding:0;color:var(--code-ink);font-size:13.5px;line-height:1.65;white-space:pre}
.cmt{color:var(--code-cmt);font-style:italic}
.kw{color:var(--code-kw);font-weight:700}

.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:52px}
.two .blk{margin-top:0}
.xlist{list-style:none;padding:0;margin:0}
.xlist li{position:relative;padding-left:28px;margin-bottom:10px}
.xlist li::before{content:"✕";position:absolute;left:2px;color:var(--warn);font-weight:800}
.tryc{border-top:6px solid var(--pc)}
.task{font-weight:650;font-size:1.08rem;margin:0 0 10px}
.steps{padding-left:1.3em;margin:0 0 12px}
.steps li{margin-bottom:6px}
details summary{cursor:pointer;font-weight:650;color:var(--ink)}
details p{background:var(--pc-soft);padding:10px 14px;border-radius:10px;margin:10px 0 0}

.quiz .q{font-size:1.15rem;font-weight:600;max-width:70ch;margin:0 0 14px}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qopt{text-align:left;padding:14px 16px;border:1.5px solid var(--line-strong);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.qopt:hover:not(:disabled){border-color:var(--pc)}
.qopt:disabled{cursor:default}
.qopt.right{background:var(--ok-soft);border-color:var(--ok)}
.qopt.right::after{content:"  ✓ Correct answer";font-weight:700;color:var(--ok)}
.qopt.wrong{background:var(--warn-soft);border-color:var(--warn)}
.qwhy{margin:14px 0 0;padding:14px 18px;border-radius:12px;max-width:80ch}
.qwhy.good{background:var(--ok-soft)}
.qwhy.bad{background:var(--warn-soft)}

.s-foot{margin-top:60px;padding-top:24px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}
.pn{display:flex;gap:10px;flex-wrap:wrap}
.pn .btn{flex-direction:column;align-items:flex-start;gap:0;max-width:340px}
.pn-l{font-size:.78rem;font-weight:500;opacity:.85}
.mark.on{background:var(--ok-soft);border-color:var(--ok)}

/* diagrams */
.dg{display:block;width:100%;height:auto}
.dg text{font-family:var(--fb);font-size:13px;fill:var(--ink)}
.dg .lb{font-weight:600}
.dg .sub{font-size:11.5px;fill:var(--ink-2);font-weight:400}
.dg .row{font-family:var(--fm);font-size:11.5px}
.dg .gl{font-size:12px;font-weight:700;fill:var(--ink-2)}
.dg .pc{fill:var(--pc)}
.nb{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.5}
.nl{fill:none}
.n.acc .nb{fill:var(--pc-soft);stroke:var(--pc);stroke-width:2.2}
.n.mut .nb{fill:var(--surface-2);stroke:var(--line)}
.n.ext .nb{fill:none;stroke-dasharray:5 4}
.n.warn .nb{fill:var(--warn-soft);stroke:var(--warn)}
.n.ok .nb{fill:var(--ok-soft);stroke:var(--ok)}
.n.grp .nb{fill:none;stroke:var(--line-strong);stroke-dasharray:3 4;stroke-width:1.2}
.n.pyr .nb{fill:var(--surface-2);stroke:var(--pc);stroke-width:1.6}
.n.table .th{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:1.5}
.n.table.acc .th{fill:var(--pc-soft);stroke:var(--pc)}
.n.table.acc .nb{fill:var(--surface)}
.e path{fill:none;stroke:var(--ink-2);stroke-width:1.6;marker-end:url(#ah)}
.e.dash path{stroke-dasharray:5 4}
.ahp{fill:var(--ink-2)}
.el rect{fill:var(--surface)}
.dg .el text{font-size:11px;fill:var(--ink-2)}
.life{stroke:var(--line-strong);stroke-dasharray:4 4}
.dg .ml{font-size:12px}
.dg .mn{fill:var(--pc);font-weight:800}
.lead{stroke:var(--line-strong);stroke-dasharray:3 3}
.grid{stroke:var(--line)}
.curve{fill:none;stroke:var(--pc);stroke-width:3}
.jd{fill:var(--ink-2);stroke:var(--surface);stroke-width:2}
.jd.good{fill:var(--ok)}.jd.bad{fill:var(--warn)}
.phone{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.5}

   d:"<b>Web apps</b> run in a browser and need no install. <b>Mobile apps</b> are installed on Android or iOS and can use the camera, GPS and notifications. <b>Desktop apps</b> are installed on a computer. <b>Cloud / SaaS</b> apps are hosted by the provider and used over the internet, usually on a subscription.",

  {t:"Engineering roles", s:"BA, designer, developer, QA, architect and DevOps",

 code:{cap:"A real HTTP exchange, as text", lang:"http", src:`POST /api/login HTTP/1.1

 n:3, p:1, t:"Programming Fundamentals",
 tag:"Every program takes input, checks it, does something useful with it and produces output.",
 why:"Frameworks change every few years, but variables, conditions, loops, functions and objects stay the same in every language you will ever use.",
 concepts:[
  {t:"Data & variables", s:"Represent values using types and named variables",
   d:"A <b>variable</b> is a named box holding a value. Its <b>type</b> says what kind of value it is: <code>string</code> (text), <code>number</code>, <code>boolean</code> (true/false), <code>array</code> (list) or <code>object</code> (group of named fields). Good names make code read like a sentence.",
   ex:"<code>const dishName = \"Masala Dosa\"</code>, <code>let quantity = 2</code>, <code>const isVeg = true</code>, and a cart as an array of objects."},
  {t:"Control flow", s:"Conditions and loops select and repeat work",
   d:"<b>Conditions</b> (<code>if / else</code>) choose between paths. <b>Loops</b> (<code>for</code>, <code>while</code>) repeat work, for example once per item in a list. Together they let a program make decisions.",
   ex:"Loop over every cart item to add up the total; then <code>if (total >= 299)</code> delivery is free, else add ₹40."},
  {t:"Functions", s:"Reusable operations with inputs and outputs",
   d:"A <b>function</b> packages a task under a name. It takes <b>parameters</b> (inputs) and <b>returns</b> a result (output). Small functions that do one thing are easy to test and reuse.",
   ex:"<code>calculateTotal(items)</code> returns the subtotal; <code>deliveryFee(total)</code> returns 0 or 40. Checkout calls both."},
  {t:"OOP", s:"Objects combine state and behavior",
   d:"<b>Object-oriented programming</b> groups data (state) and the functions that act on it (methods) into a <b>class</b>. <b>Encapsulation</b> hides internal details; <b>inheritance</b> lets one class reuse another; <b>polymorphism</b> lets different classes respond to the same method.",
   ex:"A <code>Cart</code> class holds <code>items</code> and offers <code>addItem()</code>, <code>removeItem()</code> and <code>total()</code>. The rest of the app never touches the items array directly."},
  {t:"Debugging", s:"Investigate failures using breakpoints and logs",
   d:"Debugging is a method, not guessing: <b>reproduce</b> the bug, read the <b>error message and stack trace</b>, add <b>logs</b> or set a <b>breakpoint</b> to inspect values, form a hypothesis, fix, and confirm with a test.",
   ex:"The total shows ₹NaN. A breakpoint in <code>total()</code> shows one item’s price is the string \"120\" instead of the number 120."}
 ],
 diagrams:[{cap:"Flowchart for “add item to cart”: input → validate → process → output.", spec:{type:"graph", h:300, nodes:[
   {id:"s",x:20,y:120,w:90,h:44,l:"Start",k:"pill"},
   {id:"i",x:140,y:120,w:130,l:"Read item\n+ quantity"},
   {id:"v",x:300,y:105,w:140,h:74,l:"Quantity\n1 to 20?",k:"dec acc"},
   {id:"p",x:480,y:120,w:120,l:"Add to cart"},
   {id:"t",x:630,y:120,w:110,l:"Show new\ntotal",k:"pill"},
   {id:"e",x:300,y:230,w:140,l:"Show error\nmessage",k:"warn"}],
  edges:[{f:"s",t:"i"},{f:"i",t:"v"},{f:"v",t:"p",l:"yes"},{f:"p",t:"t"},{f:"v",t:"e",l:"no"},{f:"e",t:"i",fs:"l",ts:"b",d:"M300,252 H205 V164",lx:240,ly:252}]}}],
 code:{cap:"All five ideas in one small JavaScript file", lang:"js", src:`// Data & variables
const DELIVERY_FEE = 40;

// OOP: a class holds state (items) and behaviour (methods)
class Cart {
  constructor() { this.items = []; }

  addItem(name, price, qty) {
    // Control flow: validate before processing
    if (qty < 1 || qty > 20) {
      throw new Error("Quantity must be between 1 and 20");
    }
    this.items.push({ name, price, qty });
  }

  // Functions: input → output
  subtotal() {
    let sum = 0;
    for (const item of this.items) {   // loop
      sum += item.price * item.qty;
    }
    return sum;
  }

  total() {
    const sub = this.subtotal();
    return sub >= 299 ? sub : sub + DELIVERY_FEE;
  }
}

const cart = new Cart();
cart.addItem("Masala Dosa", 120, 2);
console.log(cart.total());   // 280 (240 + 40 delivery)`},

  {t:"Process", d:"Apply the business logic. <i>Multiply price by quantity, add to subtotal, apply delivery rule.</i>"},
  {t:"Output", d:"Return or display the result. <i>Cart badge shows 2, total shows ₹280.</i>"}]},

 code:{cap:"A React component that handles loading, error, empty and success", lang:"jsx", src:`function ProductList() {
  const [products, setProducts] = useState([]);
  const [status, setStatus] = useState("loading");

  useEffect(() => {
    fetch("/api/products")
      .then(res => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(data => { setProducts(data); setStatus("ready"); })
      .catch(() => setStatus("error"));
  }, []);

  if (status === "error")   return <ErrorBox message="Couldn’t load menu" />;

    <div className="grid">

  );
}`},

 code:{cap:"Controller → service → repository in Express (Node.js)", lang:"js", src:`// routes
router.post("/orders", requireAuth, orderController.create);

// controller: HTTP in, HTTP out
async function create(req, res) {
  try {
    const order = await orderService.placeOrder(req.user.id, req.body.items);
    res.status(201).json(order);
  } catch (err) {
    if (err instanceof ValidationError) return res.status(400).json({ error: err.message });
    throw err;
  }
}

// service: business rules, no HTTP
async function placeOrder(userId, items) {
  const total = await pricing.total(items);
  if (total < 99) throw new ValidationError("Minimum order is ₹99");
  const order = await orderRepo.save({ userId, items, total, status: "PLACED" });
  await jobs.enqueue("send-invoice", { orderId: order.id });
  return order;
}

// repository: persistence only
async function save(order) {
  const { rows } = await db.query(
    "INSERT INTO orders (user_id, total, status) VALUES ($1, $2, $3) RETURNING *",
    [order.userId, order.total, order.status]
  );
  return rows[0];
}`},

 code:{cap:"Schema, a join and a transaction (PostgreSQL)", lang:"sql", src:`CREATE TABLE orders (
  id          BIGSERIAL PRIMARY KEY,
  user_id     BIGINT NOT NULL REFERENCES users(id),
  status      TEXT   NOT NULL DEFAULT 'PLACED',
  total_paise INTEGER NOT NULL CHECK (total_paise >= 0),
  created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
);
CREATE INDEX idx_orders_user ON orders(user_id);

-- Priya's last 5 orders with dish names
SELECT o.id, o.created_at, p.name, oi.qty
FROM orders o
JOIN order_items oi ON oi.order_id = o.id
JOIN products p     ON p.id = oi.product_id
WHERE o.user_id = 42
ORDER BY o.created_at DESC
LIMIT 5;

-- All or nothing
BEGIN;
  INSERT INTO orders (user_id, total_paise) VALUES (42, 28000) RETURNING id;  -- 1042
  INSERT INTO order_items (order_id, product_id, qty, price_paise)
       VALUES (1042, 101, 2, 12000), (1042, 205, 1, 4000);
COMMIT;`},

As a customer, I want to schedule an order for later,
so that lunch arrives at 1 p.m. even if I order at 10 a.m.

## Rules
R1  Can schedule from 1 hour to 2 days ahead.

function renderDiagram(spec, label) {

const PAL = ["c1","c2","c3","c4","c5"];

/* ---- step flow with numbered badges and optional example notes ---- */
function flowD(D, label) {
  const st = D.steps.map(norm), n = st.length, per = D.per || (n <= 6 ? n : Math.ceil(n / 2)), rows = Math.ceil(n / per);

/* ---- swim lanes: compare processes side by side ---- */
function lanesD(D, label) {

/* ---- comparison columns ---- */
function colsD(D, label) {
  const n = D.cols.length, gap = 14, W = 760, w = (W - (n - 1) * gap - 4) / n; let H = 0, o = "";

/* ---- hub and spokes ---- */
function hubD(D, label) {

/* ---- tree / hierarchy ---- */

 { more:"Indian IT has both models side by side, plus Global Capability Centres (GCCs): offices of foreign companies building their own internal products in India. Your daily work, career path and the skills you need differ a lot between them.",
   pts:["<b>Product company</b>: builds and owns one product for a whole market and earns from subscriptions or licences. You go deep into one domain and one codebase.","<b>Service company</b>: builds software for clients under a contract. A project starts with an RFP (request for proposal), a proposal and a signed SOW (statement of work).","<b>Fixed-price</b> projects agree the scope and price upfront; <b>time & material (T&M)</b> projects bill for the hours worked.","After go-live, service companies often run an <b>AMC</b> (annual maintenance contract) for support and small changes.","<b>Startups</b> move fast with small teams; <b>enterprises</b> have more process, more review and bigger systems."],

   tb:[{cap:"Product vs service company", head:["","Product company","Service company"], rows:[["Who decides what to build","The company’s own product team","The client"],["Revenue","Subscriptions or licences from many customers","Project fees: fixed price or T&M"],["Your work","One product, deep domain knowledge","Many projects and domains over time"],["Success measured by","Users, revenue, retention","On-time delivery, client satisfaction"],["Typical entry-level role","Feature developer on one team","Project team member, possibly client-facing"]]}] },
 { more:"Before writing any code, a team decides <b>where the software will run</b> (browser, phone, computer) and <b>how it will be hosted and sold</b> (on the company’s own servers or in the cloud as a service). Both decisions shape the whole project.",
   pts:["<b>Web application</b>: opened through a URL in a browser (Chrome, Safari). Nothing to install, updates are instant for everyone, works on any device. Built with HTML, CSS and JavaScript, backed by a server. Examples: Gmail, a restaurant dashboard.","<b>Desktop application</b>: installed on Windows, macOS or Linux. Can work offline and use the full power of the computer, but each machine must be updated. Examples: VS Code, Tally, Photoshop. Often built with C#/.NET, Java, Electron.","<b>Mobile application</b>: installed from Google Play or the App Store onto Android or iOS. Can use the camera, GPS, contacts and push notifications. Examples: the customer app, PhonePe.","<b>Hybrid / PWA</b>: a Progressive Web App is a website that can be installed to the home screen and work partly offline, blending web and mobile.","<b>Cloud service models</b> describe who manages what: <b>IaaS</b> (rent virtual servers), <b>PaaS</b> (bring your code, the platform runs it), <b>SaaS</b> (use finished software over the internet). <b>On-premise</b> means the company runs everything in its own data centre."],

   tb:[{cap:"Web vs desktop vs mobile", head:["","Web","Desktop","Mobile"], rows:[["Install needed","No, just a URL","Yes, installer","Yes, from app store"],["Works offline","Limited (PWA)","Yes","Partly, with caching"],["Updates","Instant for all users","Each machine updates","Through store, users update"],["Device access","Limited (camera via browser)","Full computer access","Camera, GPS, push, biometrics"],["Main technologies","HTML, CSS, JS, React, Angular","C#, Java, Electron, Swift","Kotlin, Swift, Flutter, React Native"],["Example","Restaurant dashboard","Kitchen printer & billing tool","Customer ordering app"]]},

 { more:"Phones, laptops and cloud servers are all built from the same parts. The difference is scale: a server has more cores, more memory, and is designed to run all day, every day.",
   pts:["<b>CPU</b>: executes instructions. More <b>cores</b> let it do several things at once; clock speed (GHz) is how fast each core works.","<b>RAM</b>: fast, temporary memory for running programs. Cleared on restart. Measured in GB.","<b>Storage</b> (SSD/HDD): slower but permanent. Keeps the OS, apps and files.","<b>Operating system</b>: manages processes, memory, files and devices so apps don’t have to.","A <b>process</b> is a running program; one server can run many processes, such as a web server and a database.","<b>Virtual machines</b> split one physical server into many smaller computers. This is how the cloud rents out servers."],

 { more:"Computers find each other by number. DNS is the global system that turns friendly names into those numbers, and caches answers so lookups are fast.",
   pts:["<b>IPv4</b> addresses look like <code>203.0.113.10</code>; the newer <b>IPv6</b> looks like <code>2001:db8::1</code> because the world ran out of IPv4 addresses.","<b>Public IP</b>: reachable from the internet. <b>Private IP</b> (e.g. 192.168.x.x, 10.x.x.x): only inside a home or company network.","A domain has parts: <code>api.example.com</code> = subdomain <b>api</b> + domain <b>example</b> + top-level domain <b>.com</b>.","<b>DNS records</b>: <b>A</b> (name → IPv4), <b>AAAA</b> (→ IPv6), <b>CNAME</b> (alias to another name), <b>MX</b> (mail server), <b>TXT</b> (verification).","Answers are cached for a <b>TTL</b> (time to live), so a DNS change can take minutes to hours to reach everyone."],
   dg:[["DNS resolution: if no cache has the answer, the resolver asks down the hierarchy.", SQ(["Browser","Resolver (ISP / 8.8.8.8)","Root server","“.com” server","example.com DNS"],[[0,1,"api.example.com?"],[1,2,"who handles .com?"],[2,1,"ask the .com servers",1],[1,3,"who handles example.com?"],[3,1,"ask example.com’s DNS",1],[1,4,"api.example.com?"],[4,1,"A 203.0.113.10 (TTL 300)",1],[1,0,"203.0.113.10 (now cached)",1]])]],

 { more:"HTTP is a simple text conversation: the client asks, the server answers. It is <b>stateless</b>: the server doesn’t remember previous requests, so the client sends a cookie or token each time to say who it is.",
   pts:["A <b>request</b> has a method (GET, POST…), a URL path, <b>headers</b> (metadata like Content-Type, Authorization) and an optional <b>body</b> (JSON data).","A <b>response</b> has a <b>status code</b> (200, 404, 500…), headers and a body.","<b>Cookies</b> and <b>tokens</b> carry login state across stateless requests.","<b>HTTPS</b> adds <b>TLS encryption</b>. The server proves its identity with a <b>certificate</b> issued by a trusted authority, then both sides agree on secret keys.","HTTP/1.1, HTTP/2 and HTTP/3 are faster versions of the same idea: same methods and codes, better delivery."],
   dg:[["HTTPS in short: prove identity, agree a secret key, then talk privately.", SQ(["Browser","example.com server"],[[0,1,"Hello, I support TLS 1.3"],[1,0,"Hello + certificate (signed by a trusted CA)",1],[0,0,"verify certificate & domain"],[0,1,"key exchange"],[1,0,"key exchange done",1],[0,1,"encrypted: POST /login {…}"],[1,0,"encrypted: 200 OK {token}",1]])],

 { more:"In production a request usually passes through more than one server program before reaching your code. Each listens on its own port.",
   pts:["<b>Web server / reverse proxy</b> (Nginx, Apache): receives internet traffic on port 443, handles HTTPS, serves static files and forwards API calls.","<b>Application server</b>: runs your code (Node.js, Spring Boot, Django, .NET), usually on an internal port like 3000 or 8080.","A <b>socket</b> is IP + port, e.g. <code>10.0.1.5:5432</code> for the database.","<code>localhost</code> / <code>127.0.0.1</code> means “this same machine”. That’s why your dev server is at <code>localhost:3000</code>.","<b>Firewalls</b> decide which ports are open to whom: only 443 is public; the database port is open only to the app server."],
   dg:[["One request through the servers and ports of the platform.", F([["User’s browser","anywhere"],["Nginx :443","HTTPS, reverse proxy"],["Node.js app :3000","Order API code"],["PostgreSQL :5432","database"]],{hl:[2]})],
       ["Which ports are reachable from where.", C([{t:"Open to the internet",items:["443 (HTTPS)","80 (redirects to 443)"]},{t:"Internal only",items:["3000 / 8080 app servers","6379 Redis cache","5432 PostgreSQL"]},{t:"Admins only (VPN)",items:["22 SSH","Monitoring dashboards"]}])]] },
 { more:"Applications need memory that survives restarts and is shared between all users. Different databases are good at different jobs, and many products use more than one.",

 { more:"Functions let you name a piece of logic, test it on its own and reuse it. Big features are built by composing many small functions.",

 { more:"Object-oriented programming organises code around things in your domain (Order, Cart, Payment), each with its own data and behaviour. Java, C#, Kotlin, Swift and TypeScript all use it heavily.",

   dg:[["Polymorphism: checkout calls pay() and each payment type handles it its own way.", T(N("PaymentMethod","interface: pay(amount)",[N("UpiPayment","pay(): send collect request"),N("CardPayment","pay(): 3-D Secure / OTP"),N("WalletPayment","pay(): deduct balance"),N("CashOnDelivery","pay(): mark as due")]),{nw:165})]],
   tb:[{cap:"The four pillars of OOP", head:["Pillar","Meaning","Example"], rows:[["Encapsulation","Keep data private, expose methods","Cart.items is private; use addItem()"],["Inheritance","Reuse a parent class","UpiPayment extends Payment"],["Polymorphism","Same method, different behaviour","payment.pay() works for UPI, card, wallet"],["Abstraction","Depend on interfaces","Checkout knows PaymentMethod, not the bank APIs"]]}] },
 { more:"Good debuggers aren’t smarter, they’re more systematic. They follow the same loop every time and never guess twice without evidence.",
   pts:["<b>Reproduce</b> the bug reliably: same input, same steps, same result.","Read the <b>error message and stack trace</b> from the top: what failed, in which file and line.","Use a <b>breakpoint</b> to pause the program; <b>step over</b> (next line), <b>step into</b> (enter a function), and <b>watch</b> variables.","Add <b>logs</b> where you can’t attach a debugger (production, mobile devices).","Narrow it down: comment out halves, or use <code>git bisect</code> to find the commit that introduced the bug.","Explain the problem out loud (<b>rubber-duck debugging</b>). It often reveals the wrong assumption."],

/* ---- mini diagrams side by side: e.g. types of inheritance ---- */
function minisD(D, label) {
  const items = D.items, n = items.length, per = D.per || Math.min(n, 4), gap = 14, W = 760, pw = (W - (per - 1) * gap - 4) / per;
  const bh0 = 34, lg = 30;
  const prep = items.map(it => {
    const m = Math.max(...it.L.map(l => l.length));
    const bw = Math.min(D.bw || 128, (pw - 16 - (m - 1) * 8) / m);
    const labs = it.L.map(l => l.map(x => wrapT(String(x).replace(/^\*/, ""), bw / 7.4)));
    const bh = Math.max(bh0, ...labs.flat().map(x => linesOf(x) * 15 + 12));
    const cap = it.s ? wrapT(it.s, pw / 6.3) : "";
    return {it, bw, labs, bh, cap, h: 40 + it.L.length * bh + (it.L.length - 1) * lg + (cap ? linesOf(cap) * 14 + 18 : 12)};
  });
  let o = "", y = 2;
  for (let r = 0; r * per < n; r++) {
    const row = prep.slice(r * per, r * per + per), ph = Math.max(...row.map(p => p.h));
    row.forEach((p, j) => {
      const x = 2 + j * (pw + gap), it = p.it, cls = PAL[(it.c !== undefined ? it.c : r * per + j) % 5];
      o += `<rect x="${x}" y="${y}" width="${pw}" height="${ph}" rx="14" class="panel"/>`;
      o += `<text x="${x + pw / 2}" y="${y + 20}" class="lb pt" text-anchor="middle" dominant-baseline="middle">${esc(it.t)}</text>`;
      const pos = it.L.map((lev, li) => lev.map((_, bi) => {
        const tw = lev.length * p.bw + (lev.length - 1) * 8, bx = x + (pw - tw) / 2 + bi * (p.bw + 8), by = y + 38 + li * (p.bh + lg);
        return [bx, by];
      }));
      const edges = it.e || it.L.slice(1).flatMap((lev, li) => lev.flatMap((_, bi) => it.L[li].map((__, pi) => [li, pi, li + 1, bi])));
      edges.forEach(([l1, i1, l2, i2]) => {
        const [ax, ay] = pos[l1][i1], [bx, by] = pos[l2][i2];
        const x1 = ax + p.bw / 2, y1 = ay + p.bh, x2 = bx + p.bw / 2, y2 = by;
        o += it.up ? `<path d="M${x2},${y2 - 1} L${x1},${y1 + 9}" class="inh"/>` : arrow(`M${x1},${y1 + 1} L${x2},${y2 - 3}`, it.dash);
      });
      it.L.forEach((lev, li) => lev.forEach((name, bi) => {
        const [bx, by] = pos[li][bi], hl = String(name).startsWith("*");
        o += `<g class="n ${hl ? "acc" : cls + " soft"}"><rect x="${bx}" y="${by}" width="${p.bw}" height="${p.bh}" rx="8" class="nb"/>${mtext(bx + p.bw / 2, by + p.bh / 2, p.labs[li][bi], "")}</g>`;
      }));
      if (p.cap) p.cap.split("\n").forEach((t, k) => { o += `<text x="${x + pw / 2}" y="${y + ph - 10 - (linesOf(p.cap) - 1 - k) * 14}" class="sub" text-anchor="middle">${esc(t)}</text>`; });
    });
    y += ph + gap;
  }
  return svgWrap(W, y - gap + 4, o, label);
}

/* ---- simple line chart ---- */
function lineD(D, label) {
  const W = 760, H = 300, x0 = 60, y0 = 20, w = 670, h = 220, max = D.max || Math.max(...D.series.flatMap(s => s.v)), n = D.x.length;
  const X = i => x0 + i * w / (n - 1), Y = v => y0 + h - v / max * h;
  let o = "";
  for (let k = 0; k <= 4; k++) { const v = max * k / 4, yy = Y(v); o += `<line x1="${x0}" y1="${yy}" x2="${x0 + w}" y2="${yy}" class="grid"/><text x="${x0 - 8}" y="${yy}" class="sub" text-anchor="end" dominant-baseline="middle">${Math.round(v)}</text>`; }
  D.x.forEach((t, i) => { o += `<text x="${X(i)}" y="${y0 + h + 18}" class="sub" text-anchor="middle">${esc(t)}</text>`; });
  D.series.forEach((s, si) => {
    const pts = s.v.map((v, i) => v === null ? null : [X(i), Y(v)]).filter(Boolean);
    o += `<polyline points="${pts.map(p => p.join(",")).join(" ")}" class="ln ${PAL[(s.c !== undefined ? s.c : si) % 5]}${s.dash ? " dash" : ""}"/>`;
    pts.forEach(p => { o += `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" class="lnd ${PAL[(s.c !== undefined ? s.c : si) % 5]}"/>`; });
    o += `<rect x="${x0 + 10 + si * 170}" y="${H - 22}" width="14" height="4" rx="2" class="lnk ${PAL[(s.c !== undefined ? s.c : si) % 5]}"/><text x="${x0 + 30 + si * 170}" y="${H - 19}" class="sub" dominant-baseline="middle">${esc(s.n)}</text>`;
  });
  if (D.yl) o += `<text x="14" y="${y0 + h / 2}" class="sub" text-anchor="middle" transform="rotate(-90 14 ${y0 + h / 2})">${esc(D.yl)}</text>`;
  return svgWrap(W, H, o, label);
}

const _render2 = renderDiagram;
renderDiagram = function (spec, label) {
  if (spec.type === "minis") return minisD(spec, label);
  if (spec.type === "line") return lineD(spec, label);
  return _render2(spec, label);
};
const MI = (items, o) => Object.assign({type:"minis", items}, o || {});
const LC = (x, series, o) => Object.assign({type:"line", x, series}, o || {});
const TB = (head, rows) => ({head, rows});
const DD = (n, k, arr) => { DEEP[n][k].dd = arr; };

 {t:"A reusable data-fetching hook", d:"Wrapping fetch logic in a <b>custom hook</b> gives every screen consistent loading and error handling. Libraries like React Query add caching and retries on top.",
  code:["jsx",`function useApi(url) {
  const [state, setState] = useState({ status: "loading", data: null });
  useEffect(() => {
    let cancelled = false;
    fetch(url, { headers: { Authorization: "Bearer " + getToken() } })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(data => !cancelled && setState({ status: data.length === 0 ? "empty" : "ready", data }))
      .catch(() => !cancelled && setState({ status: "error", data: null }));
    return () => { cancelled = true; };   // ignore late responses after unmount
  }, [url]);
  return state;
}
const { status, data } = useApi("/api/orders");`,"Custom hook"]}

  dg:["Layer order for fast rebuilds.", F([["FROM node:20-alpine","cached"],["COPY package*.json","cached unless deps change"],["RUN npm ci","cached (slow step)"],["COPY . .","changes on every edit"],["CMD node server.js"]],{hl:[2]})]},
 {t:"Multi-stage builds", d:"Build with all the tools in one stage, then copy only the output into a small final image. Smaller images start faster and have fewer vulnerabilities.",
  code:["yaml",`# Dockerfile
FROM node:20 AS build            # stage 1: full toolchain
WORKDIR /app
COPY package*.json ./
RUN npm ci
COPY . .
RUN npm run build                # compile TypeScript → dist/

FROM node:20-alpine              # stage 2: small runtime
WORKDIR /app
COPY package*.json ./
RUN npm ci --omit=dev
COPY --from=build /app/dist ./dist
USER node                        # don't run as root
CMD ["node", "dist/server.js"]`,"Multi-stage Dockerfile"]},
 {t:"Running the whole stack locally with Compose", d:"Docker Compose starts the API, database and cache together with one command.",
  code:["yaml",`# docker-compose.yml
services:
  api:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://app:secret@db:5432/orders
      REDIS_URL: redis://cache:6379
    depends_on: [db, cache]
  db:
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: secret, POSTGRES_DB: orders }
    volumes: ["pgdata:/var/lib/postgresql/data"]
  cache:
    image: redis:7
volumes: { pgdata: {} }`,"docker-compose.yml"]}
]);

DD(19,4,[
 {t:"Disaster recovery strategies and recovery plans", d:"A <b>disaster</b> (a data-centre or region outage, a corrupted database, ransomware) can take the whole system down. Disaster recovery (DR) plans decide how the business gets back online, and they are judged by two targets. <b>RPO, Recovery Point Objective</b>: how much data can you afford to recreate or lose? It is the time between the last safe copy of the data and the disaster. <b>RTO, Recovery Time Objective</b>: how quickly must you recover, and what does downtime cost? It is the time from the disaster until systems are back online. Smaller RPO and RTO need more infrastructure kept ready at the <b>DR site</b> (another region or data centre), so they cost more.",
  dg:["RPO looks back from the disaster (data loss); RTO looks forward to recovery (downtime).", F([["Recovery point (RPO)","last data saved: 10:00"],["Data loss","10:00 → 10:05: orders not yet backed up"],["Disaster","10:05: primary region down"],["Downtime","10:05 → 10:35: customers can’t order"],["Recovery time (RTO)","10:35: systems back online"]],{w:140,hl:[1,3]})],
  tb:{cap:"The four recovery plans", head:["Plan","What is kept at the DR site","How recovery works","RPO / RTO","Cost","Suits"], rows:[
   ["1. Backup & restore","Server machine images and database snapshots, stored as backups","Create servers from the images and restore the database from the latest snapshot after the disaster","Hours","$","Lower-priority systems: reports, internal tools"],
   ["2. Pilot light","All machine images as backups + a small database server kept running with continual data sync from the main site","Database is already up to date; start application servers from images and scale them up","Tens of minutes","$$","Core services"],
   ["3. Warm standby","All application servers and the database running at lower capacity, continuously synced with the main site","Everything is already running; scale it up to full capacity and switch traffic","Minutes","$$$","Business-critical services (checkout, payments)"],

/* ===== S3 OOP: class diagram relationships ===== */
DEEP[3][3].dd.splice(2, 0, {t:"Class diagram notation and the six relationships", d:"In UML class diagrams, the <b>line and arrow style</b> tells you the kind of relationship. Learning these six is enough to read almost any class diagram. A quick memory aid: <b>solid line = permanent relationship</b>, <b>dashed line = weaker or temporary</b>; <b>triangle = inheritance</b>; <b>diamond = whole–part</b> (filled diamond: the part can’t live without the whole).",
  dg:["The six class relationships with examples.", UG(300, [
    {id:"g1",x:4,y:4,w:244,h:136,l:"Association: “knows about”",k:"grp"},{id:"a1",x:16,y:56,w:92,h:38,l:"Customer",k:"cls",a:[]},{id:"b1",x:146,y:56,w:92,h:38,l:"Restaurant",k:"cls",a:[]},
    {id:"g2",x:258,y:4,w:244,h:136,l:"Inheritance: “is a”",k:"grp"},{id:"a2",x:270,y:56,w:92,h:38,l:"Customer",k:"cls",a:[]},{id:"b2",x:400,y:56,w:92,h:38,l:"User",k:"cls",a:[]},
    {id:"g3",x:512,y:4,w:244,h:136,l:"Realization: “implements”",k:"grp"},{id:"a3",x:524,y:56,w:92,h:38,l:"UpiPayment",k:"cls",a:[]},{id:"b3",x:654,y:56,w:92,h:38,l:"Payment",k:"cls",a:[]},
    {id:"g4",x:4,y:152,w:244,h:136,l:"Dependency: “uses briefly”",k:"grp"},{id:"a4",x:16,y:204,w:92,h:38,l:"OrderService",k:"cls",a:[]},{id:"b4",x:146,y:204,w:92,h:38,l:"Clock",k:"cls",a:[]},
    {id:"g5",x:258,y:152,w:244,h:136,l:"Aggregation: “has, shared”",k:"grp"},{id:"a5",x:270,y:204,w:92,h:38,l:"Menu",k:"cls",a:[]},{id:"b5",x:400,y:204,w:92,h:38,l:"Dish",k:"cls",a:[]},
    {id:"g6",x:512,y:152,w:244,h:136,l:"Composition: “owns, dies with”",k:"grp"},{id:"a6",x:524,y:204,w:92,h:38,l:"Order",k:"cls",a:[]},{id:"b6",x:654,y:204,w:92,h:38,l:"OrderItem",k:"cls",a:[]}],
   [{f:"a1",t:"b1",r:"assoc",m1:"*",m2:"*",l:"favourites",ly:118},{f:"a2",t:"b2",r:"inh",l:"Customer is a User",ly:118},{f:"a3",t:"b3",r:"real",l:"dashed + hollow triangle",ly:118},
    {f:"a4",t:"b4",r:"dep",l:"dashed open arrow",ly:266},{f:"a5",t:"b5",r:"agg",m2:"*",l:"dish can be on many menus",ly:266},{f:"a6",t:"b6",r:"comp",m2:"1..*",l:"items deleted with order",ly:266}])],
  tb:TB(["Relationship","Symbol","Meaning","Code clue"],[["Association","Solid line (arrow if one-way)","Objects know each other","A field referencing the other class"],["Inheritance","Solid line, hollow triangle","is-a","extends"],["Realization","Dashed line, hollow triangle","implements an interface","implements"],["Dependency","Dashed line, open arrow","uses temporarily","Parameter or local variable"],["Aggregation","Hollow diamond at the whole","has-a, part can exist alone","Collection of shared objects"],["Composition","Filled diamond at the whole","owns, part dies with whole","Parts created inside and never shared"]])});

/* ===== S5: more SDLC models ===== */
DEEP[5][0].dd = (DEEP[5][0].dd || []).concat([
 {t:"More SDLC models: Incremental, Iterative, Prototype, RAD and Spiral", d:"Beyond Waterfall, V-Model and Agile, five more models appear in textbooks and interviews. <b>Incremental</b> delivers the product in usable pieces. <b>Iterative</b> builds a rough full version, then improves it in rounds. <b>Prototype</b> builds a throwaway model first so users can react. <b>RAD</b> (Rapid Application Development) relies on quick prototypes and heavy user involvement over a short time. <b>Spiral</b> repeats a four-step loop with explicit risk analysis in every round.",
  dg:["How each model moves forward.", LN([
    {t:"Incremental",s:"piece by piece",steps:[["Build 1: menu + cart"],["Build 2: + payment"],["Build 3: + tracking"],["Each build is usable"]]},
    {t:"Iterative",s:"rough → refined",steps:[["v1: all features, basic"],["Feedback"],["v2: improved"],["v3: polished"]]},
    {t:"Prototype",s:"try before building",steps:[["Quick prototype"],["Users try it"],["Refine requirements"],["Build the real system"]]},
    {t:"RAD",s:"fast, user-driven",steps:[["Requirements planning"],["User design workshops"],["Rapid construction"],["Cutover / go-live"]]},
    {t:"Spiral",s:"risk-driven loops",steps:[["Set objectives"],["Analyse risks"],["Develop & test"],["Plan next loop"]]}])],
  tb:TB(["Model","Strength","Weakness","Use when"],[["Incremental","Early usable releases","Needs good overall design upfront","Product can be split into features"],["Iterative","Learns from each version","Hard to estimate the end date","Requirements are unclear at the start"],["Prototype","Users see something early","Prototype may be mistaken for the product","UI-heavy or unclear requirements"],["RAD","Very fast delivery","Needs committed users and skilled team","Small-to-medium projects, short deadlines"],["Spiral","Manages risk explicitly","Complex and costly","Large, high-risk projects"]])}
]);

/* ===== S6: use case diagram for requirements ===== */
DEEP[6][0].dd.push({t:"Use case diagram: requirements at a glance", d:"Analysts often summarise requirements as a UML <b>use case diagram</b>: who uses the system (actors) and what they can achieve (use cases). It is a quick way to confirm scope with the business before writing detailed stories. Session 8 covers all UML diagrams in detail.",
  dg:["Use case diagram for online food ordering.", UML_USECASE]});

/* ===== S15: verification vs validation ===== */
DEEP[15][4].dd.push({t:"Verification vs validation", d:"Two words that sound alike but answer different questions. <b>Verification</b>: “Are we building the product <i>right</i>?” (does it match the spec?). <b>Validation</b>: “Are we building the <i>right product</i>?” (does it meet the user’s real need?). You need both: perfectly built software that solves the wrong problem still fails.",
  dg:["Verification and validation side by side.", C([{t:"Verification",s:"built right?",items:["Checks against the specification","Reviews, walkthroughs, inspections","Static analysis, unit & integration tests","Done by the team, mostly during development","Example: does the fee match rule R2?"]},{t:"Validation",s:"right product?",items:["Checks against user needs","UAT, beta tests, usability tests","Runs the real software with real users","Done with customers, near release","Example: do customers find the fee clear?"]}])]});

DEEP[16][0].dd.push(
 {t:"Coupling and cohesion", d:"Two classic measures of design quality. <b>Coupling</b> is how much one module depends on others: aim for <b>low coupling</b>, so a change in one place doesn’t ripple everywhere. <b>Cohesion</b> is how closely the parts inside one module belong together: aim for <b>high cohesion</b>, so each module has one clear job.",
  dg:["Low coupling and high cohesion is the goal.", MI([
   {t:"High coupling ✗",s:"Every module reaches into every other",L:[["Cart","Order","Payment"],["Menu","Rider","SMS"]]},
   {t:"Low coupling ✓",s:"Modules talk through a few clear interfaces",L:[["Cart"],["*Order service"],["Payment","SMS"]]},

ADD(3, 3, [
 {t:"Design patterns: proven solutions to common problems", d:"A <b>design pattern</b> is a reusable, named solution to a problem that keeps coming up in object-oriented design. The classic catalogue (the “Gang of Four” book, 1994) groups 23 patterns into three families. You don’t need to memorise all of them; knowing the common ones helps you read code and talk about design.",
  dg:["The three families of design patterns, with common examples.", C([{t:"Creational",s:"how objects are created",items:["Singleton","Factory Method","Abstract Factory","Builder","Prototype"]},{t:"Structural",s:"how objects are combined",items:["Adapter","Facade","Decorator","Proxy","Composite"]},{t:"Behavioural",s:"how objects interact",items:["Strategy","Observer","State","Command","Template Method"]}])],
  tb:TB(["Pattern","Problem it solves","Example"],[["Singleton","Exactly one shared instance","One database connection pool for the app"],["Factory","Create the right subclass without if-else everywhere","PaymentFactory.create(\"UPI\") returns UpiPayment"],["Builder","Construct complex objects step by step","new OrderBuilder().addItem(…).withCoupon(…).build()"],["Adapter","Make an incompatible interface fit","Wrap a bank’s old SOAP API to look like PaymentProvider"],["Facade","Simple front for a complex subsystem","CheckoutFacade.placeOrder() hides 6 services"],["Strategy","Swap an algorithm at runtime","Different delivery-fee strategies per city"],["Observer","Notify many listeners when something changes","Order status change notifies app, SMS and restaurant"],["State","Behaviour changes with internal state","Order behaves differently when PLACED vs DELIVERED"]]),
  code:["java",`// Strategy pattern: swap the delivery-fee rule without touching checkout
interface DeliveryFeeStrategy { int fee(Order order); }

class FlatFee implements DeliveryFeeStrategy {
    public int fee(Order o) { return o.subtotal() >= 299 ? 0 : 40; }
}
class DistanceFee implements DeliveryFeeStrategy {
    public int fee(Order o) { return 20 + 8 * o.distanceKm(); }
}

class Checkout {
    private final DeliveryFeeStrategy feeRule;          // injected
    Checkout(DeliveryFeeStrategy feeRule) { this.feeRule = feeRule; }
    int total(Order o) { return o.subtotal() + feeRule.fee(o); }
}
// Chennai uses new Checkout(new FlatFee()); Bengaluru uses new Checkout(new DistanceFee())`,"Strategy pattern in Java"]}
]);

  code:["text",`Halstead basics (for one function)
n1 = distinct operators      n2 = distinct operands

  {t:"Caching 2. Where caching is used: every layer", d:"A single request travels through many layers between the user’s screen and the disk, and <b>every layer can cache</b>. Utilising caching at each layer reduces <b>latency</b> (waiting time) and load on the layers behind it: a request answered by the browser cache never touches the network; one answered by Redis never touches the database. The closer to the user the data is cached, the faster the response, but the harder it is to keep up to date.",

  {t:"Caching 3. Hardware level: CPU, RAM, SSD and HDD", d:"Caching starts inside the computer. The <b>CPU</b> is far faster than memory, so it keeps recently used data in tiny, very fast <b>caches</b>: <b>L1</b> (per core, smallest, fastest), <b>L2</b>, and a shared <b>L3</b>. When data isn’t there, it comes from <b>RAM</b>. The operating system also uses spare RAM as a <b>page cache</b> for files recently read from disk, which is why an app opens faster the second time. Storage drives have caches too: an <b>HDD</b> has a small RAM buffer in front of its spinning platters, and many <b>SSDs</b> have a DRAM or SLC cache in front of their flash memory. Developers rarely control these directly, but code that reads data <b>sequentially</b> and reuses it while it’s “hot” runs faster because it uses these caches well.",
   dg:["The memory hierarchy: each level caches the slower, larger level below it.", F([["CPU registers","< 1 ns","bytes"],["L1 cache","~1 ns","~64 KB per core"],["L2 cache","~4 ns","~1 MB per core"],["L3 cache","~10–20 ns","tens of MB, shared"],["RAM + page cache","~100 ns","GBs"],["SSD","~0.1 ms","has its own DRAM cache"],["HDD","~5–10 ms","spinning disk + buffer"]],{per:7,w:100})],
   tb:{head:["","HDD","SSD"], rows:[["How it stores data","Magnetic spinning platters + moving read head","Flash memory chips, no moving parts"],["Random read latency","~5–10 ms","~0.05–0.1 ms (around 100× faster)"],["Built-in cache","Small RAM buffer (tens to hundreds of MB)","DRAM cache and/or SLC write cache"],["Cost per GB","Low","Higher"],["Typical use","Backups, archives, bulk storage","Operating systems, databases, application servers"]]}},

  {t:"Caching 4. Database level: query cache, buffer pool and materialized views", d:"Databases cache at several levels. A <b>query cache</b> stores the <b>result of a SELECT query</b> keyed by its exact SQL text: if the identical query arrives again, the stored result is returned without running the query. Its weakness is that <b>any change to a table invalidates all cached results for that table</b>, so on busy, frequently updated tables it causes lock contention and little benefit. For this reason <b>MySQL deprecated its query cache in 5.7 and removed it in 8.0</b>; PostgreSQL never had one. Modern databases rely instead on the <b>buffer pool</b> (InnoDB) / <b>shared buffers</b> (PostgreSQL), which keep frequently used <b>data pages</b> in RAM, plus cached <b>query plans</b>, and <b>materialized views</b> that store the result of an expensive query until it is refreshed. Caching of whole query results has largely moved to the <b>application layer</b> (Redis).",

   tb:{head:["Database cache","What it stores","Notes"], rows:[["Query cache","Exact SQL text → result set","Removed in MySQL 8.0; cleared on every write to the table"],["Buffer pool / shared buffers","Data and index pages in RAM","The most important DB cache; size it to fit the hot data"],["Plan cache / prepared statements","Execution plans","Avoids re-planning the same query"],["Materialized view","Stored result of an expensive query","Refreshed on a schedule or on demand"],["Read replicas","A copy of the whole database for reads","Not a cache strictly, but offloads reads the same way"]]},
   code:["sql",`-- Expensive dashboard query: total orders per restaurant per day
CREATE MATERIALIZED VIEW daily_restaurant_sales AS
SELECT restaurant_id, date_trunc('day', created_at) AS day,
       COUNT(*) AS orders, SUM(total_paise) AS revenue_paise
FROM orders
GROUP BY restaurant_id, day;

SELECT * FROM daily_restaurant_sales WHERE restaurant_id = 7;  -- instant: reads stored rows

REFRESH MATERIALIZED VIEW CONCURRENTLY daily_restaurant_sales;  -- e.g. every 15 minutes (cron job)`,"Caching an expensive query with a materialized view (PostgreSQL)"]},

  {t:"Caching 5. Network level: DNS cache (and CDN)", d:"Every time an app calls <code>api.example.com</code>, the domain name must be turned into an IP address. A full DNS lookup can take tens of milliseconds, so the answer is <b>cached at several places</b>: in the browser, in the operating system, in the home or office router, and at the ISP’s recursive resolver. Each cached answer is trusted for its <b>TTL</b> (time to live) set by the domain owner. A short TTL (60 s) lets you change servers quickly; a long TTL (1 day) means faster lookups but slower changes. When a website moves to a new server and some users still reach the old one, stale DNS cache is the usual reason. The other big network cache is the <b>CDN</b>: copies of images, scripts and videos stored at <b>edge servers</b> close to users (see Session 18 → Networking).",
   dg:["A DNS lookup checks the nearest cache first and stops at the first hit.", F([["Browser DNS cache","hit? done"],["Operating system cache","hit? done"],["Router cache","hit? done"],["ISP / resolver cache","hit? done"],["Full lookup","root → .com → example.com"],["Answer cached everywhere","for its TTL"]],{per:6,w:118})],
   code:["bash",`dig api.example.com            # ANSWER section shows the IP and remaining TTL, e.g. "300"
dig api.example.com            # run again: "Query time: 0 msec" → served from the resolver cache

# Clearing a stale DNS cache
ipconfig /flushdns                     # Windows
sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder   # macOS
resolvectl flush-caches                # Linux (systemd-resolved)
# Chrome: chrome://net-internals/#dns → "Clear host cache"`,"Inspecting and flushing DNS caches"]},

  {t:"Caching 6. Application level: Redis and Memcached", d:"The application cache sits between your API and the database. It is a separate <b>in-memory key–value store</b>, shared by all API servers, that answers in about a millisecond. The two classic choices are <b>Memcached</b>, simple and very fast for plain key–value caching, and <b>Redis</b>, which adds rich data structures, persistence, replication and pub/sub, and is the more common choice today. Typical things to cache: restaurant menus, product details, user sessions, results of expensive calculations, rate-limit counters. The usual pattern is <b>cache-aside</b>: read from the cache; on a miss, read the database and put the result in the cache with a TTL.",
   dg:["Cache-aside with Redis: the second request never reaches the database.", SQ(["Mobile app","Order API","Redis","PostgreSQL"],[[0,1,"GET /restaurants/7/menu"],[1,2,"GET menu:7"],[2,1,"(nil): miss",1],[1,3,"SELECT … menu for restaurant 7"],[3,1,"rows (45 ms)",1],[1,2,"SET menu:7 … EX 600"],[1,0,"200 menu",1],[0,1,"same request again"],[1,2,"GET menu:7"],[2,1,"cached menu (1 ms): hit",1],[1,0,"200 menu",1]])],
   tb:{head:["","Memcached","Redis"], rows:[["Data model","Simple strings (key → blob)","Strings, hashes, lists, sets, sorted sets, streams, JSON"],["Persistence","None: everything lost on restart","Optional snapshots (RDB) and append-only log (AOF)"],["Replication / high availability","Not built in","Replicas, Sentinel, Redis Cluster"],["Extra features","—","Pub/sub, Lua scripts, transactions, TTL per key, geo"],["Threading","Multi-threaded","Mostly single-threaded command execution (very fast)"],["Best for","Simple, very large, pure caches","Caching plus sessions, leaderboards, rate limits, queues"],["Managed services","AWS ElastiCache for Memcached","AWS ElastiCache / MemoryDB, Azure Cache for Redis, Google Memorystore"]]},
   code:["js",`import { createClient } from "redis";
const redis = createClient({ url: process.env.REDIS_URL });
await redis.connect();

async function getMenu(restaurantId) {
  const key = "menu:" + restaurantId;
  const cached = await redis.get(key);                 // 1. try the cache
  if (cached) return JSON.parse(cached);               //    hit: ~1 ms

  const menu = await menuRepo.findByRestaurant(restaurantId);   // 2. miss: database
  await redis.set(key, JSON.stringify(menu), { EX: 600 });      // 3. keep for 10 minutes
  return menu;
}

async function updateDishPrice(restaurantId, dishId, pricePaise) {
  await menuRepo.updatePrice(dishId, pricePaise);
  await redis.del("menu:" + restaurantId);             // invalidate so nobody sees the old price
}`,"Cache-aside with Redis in Node.js"]},

  {t:"Caching 7. Browser cache", d:"The fastest request is the one that never leaves the device. Browsers keep copies of files and responses in a <b>memory cache</b> (for the current tab) and a <b>disk cache</b> (across visits). The server controls this with <b>HTTP cache headers</b>: <code>Cache-Control: max-age=…</code> says how long a response is fresh; an <code>ETag</code> lets the browser ask “has it changed?” and receive a tiny <code>304 Not Modified</code> instead of the whole file. A common technique is <b>cache busting</b>: build tools add a content hash to file names (<code>app.3f9a2c.js</code>) so those files can be cached for a year, and a new release simply uses new names. Beyond the HTTP cache, <b>Service Workers</b> (Cache API) power offline-capable web apps, and <code>localStorage</code>, <code>sessionStorage</code> and <code>IndexedDB</code> let the app store data itself.",

   tb:{head:["Header / storage","Meaning","Example"], rows:[["Cache-Control: max-age=31536000, immutable","Fresh for a year; never revalidate","Hashed files: app.3f9a2c.js, logo.8b1e.png"],["Cache-Control: no-cache","Store, but revalidate every time","index.html, so users get new releases"],["Cache-Control: no-store","Never store at all","Pages with personal or payment data"],["Cache-Control: private / public","Only the user’s browser / also CDNs and proxies","private for “My orders”, public for menu images"],["ETag + If-None-Match","Fingerprint for cheap revalidation (304)","API: GET /restaurants/7/menu"],["Service Worker (Cache API)","App-controlled cache, works offline","PWA shows last menu without internet"],["localStorage / IndexedDB","App stores its own data","Remember the last delivery address"]]},

  {t:"Caching 8. Keeping caches correct: invalidation, eviction and common pitfalls", d:"A cache is a <b>copy</b>, and copies go out of date. There is a famous saying (attributed to Phil Karlton) that the two hard things in computer science are cache invalidation and naming things. Three decisions keep a cache correct and healthy. <b>Expiry (TTL)</b>: how long a copy may be used. <b>Invalidation</b>: deleting or updating the copy when the original changes. <b>Eviction</b>: what to remove when the cache is full. Not everything should be cached: avoid caching rapidly changing data, personal data in shared caches, or anything where a stale value is dangerous (such as account balances).",

  /* ---------- Season 1: how JS works ---------- */
  {t:"1. Execution context: where all JavaScript runs", d:"<b>In simple words:</b> everything in JavaScript happens inside an <b>execution context</b>, a box the engine creates to run code. It has two parts. The <b>memory component</b> (also called the <b>variable environment</b>) stores variables and functions as key–value pairs. The <b>code component</b> (the <b>thread of execution</b>) runs the code one line at a time. JavaScript is a <b>synchronous, single-threaded</b> language: it executes one command at a time, in order. <b>Think of it like</b> a chef with one notebook (memory) who follows the recipe one step at a time (code).",

  {t:"2. How code is executed: two phases and the call stack", d:"Running a program creates the <b>global execution context</b> in two phases. <b>Phase 1, memory creation:</b> JavaScript scans the code and reserves memory: variables declared with <code>var</code> get the placeholder <code>undefined</code>, and function declarations get their whole code. <b>Phase 2, code execution:</b> lines run top to bottom, real values replace <code>undefined</code>. Every function <b>call</b> creates a brand-new execution context (with the same two phases) and, when the function returns, that context is deleted. The <b>call stack</b> keeps track of which context is running: new ones are pushed on top, finished ones popped off. (It is also called the execution context stack, program stack, control stack or runtime stack.)",
   dg:["Call stack snapshots while the program above runs (top of the stack is at the top).", MI([
     {t:"Start",s:"global context created",L:[["*Global EC"]],e:[]},
     {t:"square(n) called",s:"new context pushed",L:[["*square(n)"],["Global EC"]],e:[]},
     {t:"returns 4",s:"context popped",L:[["*Global EC"]],e:[]},
     {t:"square(4) called",s:"pushed",L:[["*square(4)"],["Global EC"]],e:[]},
     {t:"returns 16",s:"popped",L:[["*Global EC"]],e:[]},
     {t:"Program ends",s:"stack empty",L:[["(empty)"]],e:[]}],{per:6,bw:104})],
   code:["js",`var n = 2;
function square(num) {
  var ans = num * num;   // ans lives in square's own memory component
  return ans;            // returning hands the value back and deletes this context
}
var square2 = square(n); // 4
var square4 = square(4); // 16`,"Program used in the diagrams"]},

  {t:"3. Hoisting: using things before they are declared", d:"<b>In simple words:</b> because of the memory phase, JavaScript already knows about variables and function declarations <i>before</i> any line runs. So you can call a function declared further down the file, and a <code>var</code> variable used too early gives <code>undefined</code> instead of an error. This behaviour is called <b>hoisting</b>. It is <i>not</i> code being physically moved to the top; it is the result of memory being set up first. Function <i>expressions</i> and arrow functions stored in variables behave like variables, not like function declarations.",
   dg:["What memory holds before the first line runs.", C([{t:"var x = 7",items:["Memory: x → undefined","Use before line: undefined"]},{t:"function getName() {…}",items:["Memory: whole function","Call before line: works ✓"]},{t:"var getName2 = () => {…}",items:["Memory: getName2 → undefined","Call before line: TypeError"]},{t:"let / const",items:["Memory: reserved, uninitialised","Use before line: ReferenceError (TDZ)"]}])],

var x = 7;
function getName() { console.log("Namaste JavaScript"); }
var getName2 = () => console.log("arrow");`,"Hoisting in action"]},

  {t:"4. Functions and their own variable environment", d:"Each function call gets its <b>own</b> memory component, completely separate from the global one and from other calls. That is why a variable named <code>x</code> inside a function does not clash with a global <code>x</code>.",

  {t:"5. The shortest JS program: window and this", d:"Even an <b>empty file</b> makes the engine create a global execution context, a <b>global object</b> and a global <code>this</code>. In browsers the global object is <code>window</code> (in Node.js it is <code>global</code>; <code>globalThis</code> works everywhere). At the top level of a script, <code>this === window</code>. Variables declared with <code>var</code> and function declarations in global scope become properties of <code>window</code>; <code>let</code> and <code>const</code> do not.",

  {t:"6. undefined vs not defined", d:"<code>undefined</code> is a real value: a <b>placeholder</b> JavaScript puts in memory during the memory phase, meaning “this variable exists but has no value yet”. <b>Not defined</b> means the variable was never declared at all, so using it throws a <code>ReferenceError</code>. JavaScript is <b>loosely (weakly) typed</b>: one variable can hold a number, then a string. Avoid assigning <code>undefined</code> yourself; use <code>null</code> to say “intentionally empty”.",
   dg:["Three different situations.", C([{t:"undefined",s:"declared, no value yet",items:["var a; console.log(a) → undefined","Memory was reserved","No error"]},{t:"not defined",s:"never declared",items:["console.log(z) → ReferenceError","No memory for it","Program stops here"]},{t:"null",s:"intentionally empty",items:["let coupon = null","Set by the developer","Means “no value on purpose”"]}])]},

  {t:"7. Scope, lexical environment and the scope chain", d:"<b>Scope</b> answers “where can I use this variable?”. Every execution context has a <b>lexical environment</b>: its own local memory <b>plus a reference to the lexical environment of its parent</b>, meaning where the function was <i>written</i> in the code (that is what “lexical” means). When JavaScript looks for a variable, it searches the current local memory, then the parent’s, then the grandparent’s, up to global. This chain of references is the <b>scope chain</b>. If the variable isn’t found anywhere, you get a <code>ReferenceError</code>.",
   dg:["Looking up b from inside c(): JavaScript walks up the scope chain.", F([["c() local memory","b? not here"],["a() memory (parent)","b = 10 ✓ found"],["Global memory","(not needed)"],["null","→ ReferenceError if not found"]],{w:170,hl:[1]})],
