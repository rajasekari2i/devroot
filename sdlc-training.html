(function () {
  const D = DEEP[19][4];
  const keep = (D.dd || []).filter(x => x.t !== "Auto-scaling");
  D.pts = (D.pts || []).concat(["<b>Auto scaling</b> adds or removes servers automatically: reactively (on metrics), proactively (on a schedule) or predictively (from forecasts).","<b>Load balancers</b> spread traffic across healthy servers: ALB (Layer 7), NLB (Layer 4), Gateway LB (Layer 3), GSLB (across regions)."]);

  const AS = [
  {t:"Auto scaling 1. What is auto scaling?", d:"<b>Auto scaling</b> automatically <b>adds servers when demand rises</b> (scale out) and <b>removes them when it falls</b> (scale in), so the application always has enough capacity without paying for idle machines. In AWS, servers are grouped into an <b>Auto Scaling group (ASG)</b> with three numbers: <b>minimum size</b> (never fewer than this, even at night), <b>desired capacity</b> (how many should run right now) and <b>maximum size</b> (a cost and safety ceiling). The ASG also <b>replaces unhealthy instances</b> automatically. Azure (Virtual Machine Scale Sets), Google Cloud (Managed Instance Groups) and Kubernetes (Horizontal Pod Autoscaler) work the same way. <b>Think of it like</b> a restaurant that calls in extra waiters for the lunch rush and sends them home in the afternoon, but always keeps at least two on the floor.",
   dg:["An Auto Scaling group with min 2, desired 2, max 4.", UG(270, [
     {id:"g",x:20,y:10,w:720,h:120,l:"Auto Scaling group: order-api",k:"grp"},
     {id:"i1",x:40,y:45,w:150,h:60,l:"Instance 1",s:"running",k:"acc"},
     {id:"i2",x:210,y:45,w:150,h:60,l:"Instance 2",s:"running",k:"acc"},
     {id:"i3",x:400,y:45,w:150,h:60,l:"Instance 3",s:"added when busy",k:"ext"},
     {id:"i4",x:570,y:45,w:150,h:60,l:"Instance 4",s:"added when busy",k:"ext"},
     {id:"mn",x:40,y:145,w:320,h:32,l:"Minimum size = 2 (always running)",k:"c1"},
     {id:"ds",x:40,y:185,w:320,h:32,l:"Desired capacity = 2 (target right now)",k:"c2"},
     {id:"mx",x:40,y:225,w:680,h:32,l:"Maximum size = 4 (scale out as needed, never beyond)",k:"c3"},
     {id:"so",x:400,y:145,w:320,h:32,l:"Scale out as needed",k:"mut"}],[])],
   tb:{head:["Setting","Meaning","Example for the Order API"], rows:[["Minimum size","Lowest number of instances, even at zero traffic","2: one per Availability Zone for resilience"],["Desired capacity","Number the ASG keeps running now; scaling policies change it","2 at night, 6 at lunch"],["Maximum size","Upper limit for cost and safety","10"],["Health check replacement","Unhealthy instances are terminated and replaced","A crashed instance is replaced in a few minutes"],["Cooldown / warm-up","Wait time so the group doesn’t over-react","300 s before the next scaling action"]]}},

  {t:"Auto scaling 2. The three types: reactive, proactive and predictive", d:"Auto scaling can be triggered in three ways. <b>Reactive scaling</b> responds to what is happening now (for example, CPU is high). <b>Proactive (scheduled) scaling</b> changes capacity at known times you set in advance. <b>Predictive scaling</b> uses machine learning on past traffic to forecast demand and add capacity <b>before</b> it arrives. Teams usually combine them: scheduled or predictive for known peaks, reactive as the safety net for surprises.",
   dg:["Three ways to decide when to scale.", C([{t:"Reactive",s:"dynamic scaling",items:["Trigger: live metrics (CPU, requests, queue length)","AWS: target tracking, step scaling","Handles surprises","Lags a few minutes behind a sudden spike"]},{t:"Proactive",s:"scheduled scaling",items:["Trigger: a schedule you define (cron)","AWS: scheduled actions","Perfect for known peaks: lunch, sales","Can’t handle the unexpected"]},{t:"Predictive",s:"forecast-based",items:["Trigger: ML forecast from past traffic","AWS: predictive scaling policy","Capacity ready before the peak","Needs history with regular patterns"]}])]},

  {t:"Auto scaling 3. Reactive scaling (dynamic)", d:"Reactive scaling watches a metric and adjusts capacity when it crosses a target. The simplest and most recommended form is <b>target tracking</b>: you choose a target, such as “keep average CPU at 50%” or “1,000 requests per instance”, and the ASG adds or removes instances to stay near it, like a thermostat. <b>Step scaling</b> adds different amounts depending on how far the metric is from the threshold. Because it reacts to load that has already arrived, there is a short delay while new instances start.",
   dg:["A reactive (target tracking) scaling loop.", F([["Watch metric","average CPU every minute"],["Above target?","CPU > 50% for 3 min"],["Scale out","desired 2 → 4"],["New instances start","~2–3 min + health check"],["Below target long enough?","scale in, never below min"]],{loop:"continuous"})],
   code:["bash",`# Target tracking: keep average CPU of the group at 50%
aws autoscaling put-scaling-policy \\
  --auto-scaling-group-name order-api-asg \\
  --policy-name cpu-50 \\
  --policy-type TargetTrackingScaling \\
  --target-tracking-configuration '{
      "PredefinedMetricSpecification": { "PredefinedMetricType": "ASGAverageCPUUtilization" },
      "TargetValue": 50.0
  }'`,"Reactive scaling policy (AWS CLI)"]},

  {t:"Auto scaling 4. Proactive scaling (scheduled)", d:"When you <b>know</b> when traffic will change, schedule the capacity change in advance. A <b>scheduled action</b> sets the group’s min / max / desired capacity at a specific time, either once (a festival sale) or on a recurring <b>cron-like</b> schedule (every weekday lunch). The load balancer automatically starts sending traffic to the new instances once they pass health checks. Scheduled actions are created with the AWS CLI, SDKs or infrastructure-as-code tools.",
   dg:["Scaling on a schedule.", F([["Schedule","cron: 0 11 * * MON-FRI","or a one-off event"],["Scaling event","fires at 11:00"],["Set capacity","min 4 / max 12 / desired 6"],["ASG launches instances","ready before lunch"],["Load balancer","routes traffic to them"]])],
   code:["bash",`# Every weekday at 11:00 UTC: prepare for the lunch rush
aws autoscaling put-scheduled-update-group-action \\
  --auto-scaling-group-name order-api-asg \\
  --scheduled-action-name lunch-peak \\
  --recurrence "0 11 * * MON-FRI" \\
  --min-size 4 --max-size 12 --desired-capacity 6

# Every weekday at 15:00 UTC: scale back down
aws autoscaling put-scheduled-update-group-action \\
  --auto-scaling-group-name order-api-asg \\
  --scheduled-action-name after-lunch \\
  --recurrence "0 15 * * MON-FRI" \\
  --min-size 2 --max-size 10 --desired-capacity 2`,"Scheduled scaling (AWS CLI)"]},

  {t:"Auto scaling 5. Predictive scaling", d:"<b>Predictive scaling</b> follows three steps: <b>predict traffic → compute the capacity needed → scale out ahead of time</b>. It analyses historical load (for example the last two weeks), learns daily and weekly patterns, forecasts the next hours, and schedules capacity so new instances are already running when the load arrives. It works best for apps with regular cycles, like a food-ordering platform’s lunch and dinner peaks. Keep a reactive policy alongside it for surprises.",
   dg:["The predictive scaling cycle.", F([["Predict traffic","ML on past 14 days of load"],["Compute scale","instances needed per hour"],["Scale out ahead","launch before the peak"],["Reactive safety net","handles the unexpected"]],{w:170,loop:"forecast refreshed daily"})]},
  {t:"Reactive vs predictive: why timing matters", d:"With reactive scaling, capacity rises only after traffic does, so users at the start of the rush may see slow responses. Predictive scaling raises capacity just before the expected rush.",
   dg:["Lunch rush: traffic vs capacity (instances), 10:00 to 15:00.", LC(["10:00","11:00","11:30","12:00","12:30","13:00","14:00","15:00"],[{n:"Traffic needs (instances)",v:[2,3,5,8,9,8,4,2],c:3},{n:"Reactive capacity",v:[2,2,3,5,8,9,8,4],c:0,dash:1},{n:"Predictive capacity",v:[2,4,6,9,9,9,5,3],c:1}],{yl:"instances",max:12})]}
  ];

  const LB = [
  {t:"Load balancing 1. What is a load balancer?", d:"A <b>load balancer distributes network traffic across multiple servers</b> to improve <b>concurrency</b> (more users at once), <b>reliability</b> (if one server fails, traffic goes to the healthy ones) and <b>latency</b> (no single server gets overloaded). Clients talk to one address, the load balancer, and never need to know how many servers are behind it. It constantly runs <b>health checks</b> and only sends traffic to servers that pass. <b>Think of it like</b> the person at a busy restaurant entrance who seats each new group at the next free table, and skips the table that’s being cleaned.",
   dg:["One entry point, traffic spread across healthy servers.", UG(250, [

    [{f:"u",t:"lb",d:"M90,125 H160"},{f:"lb",t:"s1",d:"M330,115 H390 V33 H450"},{f:"lb",t:"s2",d:"M330,125 H450"},{f:"lb",t:"s3",d:"M330,135 H390 V217 H450",dash:1,l:"✗",lx:410,ly:217}])],
   tb:{head:["Benefit","How the load balancer helps"], rows:[["Concurrency","Spreads requests so many servers serve users in parallel"],["Reliability / high availability","Health checks remove failed servers; servers in several Availability Zones survive a data-centre failure"],["Lower latency","No single server is overloaded; requests go to the least busy one"],["Zero-downtime deployments","Drain old servers and add new ones behind the same address (rolling, blue-green)"],["Security","Terminates HTTPS, hides servers in private subnets, integrates with WAF"]]}},

  {t:"Load balancing 2. Types of load balancers (by network layer)", d:"Load balancers differ in <b>which network layer</b> they work at, which decides how much of each request they can see. A <b>Layer 7</b> load balancer understands HTTP: it <b>inspects the content</b> (URL path, host name, headers, cookies) and routes based on it. A <b>Layer 4</b> load balancer works with TCP/UDP connections and <b>does not inspect the contents</b> of packets; it just forwards them very fast. In AWS these are the Application, Network, Classic and Gateway Load Balancers. Global server load balancing works one level higher, choosing between whole regions.",
   dg:["What each load balancer can see.", C([{t:"ALB",s:"Layer 7: HTTP / HTTPS",c:0,items:["Inspects content and routes on path, host, headers","Flexible: microservices, containers","WebSockets, HTTP/2, gRPC","Web apps and REST APIs"]},{t:"NLB",s:"Layer 4: TCP / UDP / TLS",c:1,items:["Does not inspect packet contents","Static IPs, millions of requests/s","Ultra-low latency","Games, IoT, internal services"]},{t:"CLB",s:"Layer 4/7: HTTP / TCP / SSL",c:3,items:["Previous generation","Legacy: avoid for new systems","Migrate to ALB or NLB"]},{t:"Gateway LB",s:"Layer 3: IP packets",c:2,items:["Routes traffic through security appliances","Firewalls, intrusion detection","Transparent to apps"]},{t:"GSLB",s:"Global (DNS level)",c:4,items:["Chooses a region / data centre","Latency, geo or failover routing","Route 53, Azure Traffic Manager, Cloudflare"]}])],
   tb:{head:["","ALB","NLB","CLB","Gateway LB","GSLB"], rows:[["OSI layer","7 (application)","4 (transport)","4 and 7","3 (network)","DNS / global"],["Protocols","HTTP, HTTPS, gRPC, WebSocket","TCP, UDP, TLS","HTTP, HTTPS, TCP, SSL","IP (GENEVE)","DNS answers"],["Inspects content?","Yes: path, host, headers, query","No: only IP and port","Limited","No (passes to appliances)","No"],["Static IP","No (DNS name)","Yes, one per AZ (or Elastic IP)","No","—","—"],["Best for","Websites, APIs, microservices","High performance, fixed IPs, non-HTTP","Nothing new: legacy only","Inline firewalls and inspection","Multi-region apps and DR failover"]]}},
  {t:"A note on “GLB”", d:"The abbreviation “GLB” is used for two different things, so it’s worth being precise. <b>Gateway Load Balancer (GWLB)</b> is an AWS Layer 3 service that sends traffic through third-party virtual appliances such as firewalls or intrusion-detection systems before it reaches your app. <b>Global Server Load Balancing (GSLB)</b> balances traffic across <b>regions or data centres</b>, usually through DNS: users are sent to the nearest healthy region, and if a whole region fails, traffic moves to another one. GSLB is what makes the multi-site disaster recovery plan above work.",
   dg:["Global server load balancing across two regions.", F([["User in Chennai","resolves www.example.com"],["GSLB (DNS)","latency + health routing"],["Nearest healthy region","Mumbai"],["Regional load balancer","ALB → servers"]],{w:170,loop:"if Mumbai fails → answer with Singapore"})]},

  {t:"Load balancing 3. How an ALB routes requests (Layer 7)", d:"Because an ALB reads each HTTP request, one load balancer can serve many services. <b>Listener rules</b> match on the path, host name, headers or query string and forward the request to a <b>target group</b> (a set of servers, containers or functions). This is why ALBs are the usual front door for microservices.",
   dg:["One ALB, several target groups.", UG(300, [
     {id:"c",x:10,y:125,w:140,h:50,l:"HTTPS request",k:"pill acc"},
     {id:"alb",x:190,y:115,w:160,h:70,l:"ALB",s:"listener :443 + rules",k:"stt acc"},
     {id:"t1",x:470,y:10,w:280,h:46,l:"/api/orders/* → order-service targets",k:"c1"},
     {id:"t2",x:470,y:80,w:280,h:46,l:"/api/menu/* → menu-service targets",k:"c2"},

     {id:"t4",x:470,y:220,w:280,h:46,l:"default → web frontend targets",k:"c5"}],
    [{f:"c",t:"alb"},{f:"alb",t:"t1",d:"M350,140 H410 V33 H470"},{f:"alb",t:"t2",d:"M350,145 H410 V103 H470"},{f:"alb",t:"t3",d:"M350,155 H410 V173 H470"},{f:"alb",t:"t4",d:"M350,160 H410 V243 H470"}])]},

  {t:"Load balancing 4. A highly available architecture with ALB, NLB and Auto Scaling groups", d:"A common production layout combines everything in this sub-topic. Users reach the VPC through the <b>Internet Gateway (IGW)</b>. An <b>internet-facing ALB</b> in the public subnets sends HTTP traffic to the <b>web tier</b>, an Auto Scaling group of servers in private subnets. The web tier calls the <b>app tier</b> through an <b>internal NLB</b> (fast Layer 4, never exposed to the internet), and the app tier is its own Auto Scaling group. Every tier spans <b>two Availability Zones (A and B)</b>, so losing one data centre leaves the system running. <b>NAT gateways</b> in the public subnets let private servers reach the internet for updates without being reachable from it.",
   dg:["Three-tier architecture across two Availability Zones.", UG(420, [
     {id:"vpc",x:180,y:6,w:576,h:408,l:"VPC (private network)",k:"grp"},

    [{f:"u",t:"igw",d:"M85,205 H95"},{f:"igw",t:"alb",d:"M165,205 H200"},

   tb:{head:["Component","Role in the architecture"], rows:[["Internet Gateway (IGW)","Connects the VPC to the internet"],["ALB (internet-facing)","Layer 7 entry point: HTTPS, routing, health checks"],["Web tier ASG","Frontend / API servers in private subnets, scaled automatically"],["NLB (internal)","Fast Layer 4 balancing between tiers, not reachable from the internet"],["App tier ASG","Business-logic servers, scaled independently of the web tier"],["Two Availability Zones","Every tier survives the loss of one data centre"],["NAT gateway","Outbound internet access for private servers (updates, external APIs)"]]}},

  {t:"Load balancing 5. How the load balancer and the Auto Scaling group work together", d:"The two services are designed to cooperate. The ASG registers every new instance in the load balancer’s <b>target group</b>; the load balancer sends traffic only after the instance passes <b>health checks</b>. If an instance fails, the load balancer stops sending it traffic and the ASG replaces it. When scaling in, the load balancer first <b>drains</b> the instance, letting in-flight requests finish, before it is terminated.",

(function () {
  const S = SESSIONS.find(s => s.n === 18);
  S.concepts.push(
    {t:"DevOps & DevSecOps", s:"One team culture for building, securing, shipping and running software",
     d:"<b>DevOps</b>, a combination of “development” and “operations”, is a <b>collaborative approach that bridges the gap between software development (Dev) and IT operations (Ops)</b>. Instead of developers “throwing code over the wall” to a separate operations team, both share responsibility for the whole life cycle: plan, code, build, test, release, deploy, operate and monitor, supported by heavy automation. <b>DevSecOps</b> adds <b>security</b> to that shared responsibility, building security checks into every stage instead of leaving them to the end.",
     ex:"The checkout team writes the code, owns its CI/CD pipeline, gets paged when checkout breaks at night, and has security scans running automatically on every pull request and every deployment."},
    {t:"Deployment strategies", s:"Different ways to replace the old version with the new one safely",
     d:"A <b>deployment strategy</b> is the plan for <b>how a new version replaces the running one</b> in production. Strategies differ in downtime, risk, speed of rollback and how much extra infrastructure they need. The six common ones are <b>in-place</b> (update existing servers), <b>rolling</b> (gradually update servers in batches), <b>red-black</b> (instant cutover to a new environment), <b>blue-green</b> (gradually replace the existing servers with new ones), <b>canary</b> (test with a small share of users, then roll out) and <b>immutable</b> (build a fresh, cloned environment and dispose of the old one).",
     ex:"A payment-service change is released as a canary to 5% of users first; a menu text change uses a simple rolling deployment."}
  );
  LAY[18].s.push(
    {q:"What are DevOps and DevSecOps?", a:"DevOps means developers and operations people work as one team, with automation, so software is built, tested, released and run quickly and reliably. DevSecOps adds security checks into every step, instead of a security review only at the end.", an:"A restaurant where the cooks, the waiters and the hygiene inspector work together all day, instead of the inspector visiting only once a year."},
    {q:"What is a deployment strategy?", a:"A deployment strategy is the plan for swapping the old version of an app for the new one in production, ideally without users noticing and with an easy way back if something goes wrong.", an:"Renovating a busy restaurant: close it for a day (in-place), redo one section at a time (rolling), or open a fully ready new branch and move customers across (blue-green)."}
  );

  /* ================= Sub-topic 6: DevOps & DevSecOps ================= */
  DEEP[18][5] = {
    more:"The main <b>benefits</b> of DevOps are better <b>collaboration</b> (one team, shared goals), <b>fast delivery</b> (small changes released often through automated pipelines), <b>reliability</b> (automated tests and monitoring catch problems early) and <b>scalability</b> (infrastructure as code and automation make growth repeatable). DevSecOps applies the same automation to security, so problems are found when they are cheapest to fix.",
    pts:["DevOps = <b>culture + practices + tools</b> that unite development and operations.","The DevOps loop: <b>Plan → Code → Build → Test → Release → Deploy → Operate → Monitor</b>, and back to Plan.","Key practices: version control, CI/CD, infrastructure as code, configuration management, containers, automated testing, monitoring and logging.","DevSecOps adds <b>security</b> to the loop: SAST, IaC scanning and SCA while coding; DAST at deploy; IAST, RASP and WAF while operating.","“<b>Shift left</b>”: find problems (including security issues) as early in the loop as possible."],

    more:"Choosing a strategy is a trade-off between <b>cost</b> (extra servers during the deployment), <b>risk</b> (how many users see a bad release), <b>downtime</b> and <b>rollback speed</b>. Most teams use rolling deployments for everyday changes and canary or blue-green for risky ones. Load balancers and Auto Scaling groups (Session 19) are what make these strategies possible.",
    pts:["<b>In-place</b>: update existing servers with the new version. Simple, but usually some downtime.","<b>Rolling</b>: gradually update servers in batches. No downtime, slow rollback.","<b>Red-black</b>: build a new environment, then cut over all traffic instantly.","<b>Blue-green</b>: run old (blue) and new (green) side by side and shift traffic to green, gradually or at once.","<b>Canary</b>: send a small share of users to the new version, watch metrics, then roll out.","<b>Immutable</b>: never modify servers; create fresh, cloned ones and dispose of the old."],
    dg:[["The six deployment strategies.", C([{t:"In-place",c:0,items:["Update existing servers","Cheapest","Downtime likely"]},{t:"Rolling",c:1,items:["Batches of servers","No downtime","Mixed versions for a while"]},{t:"Red-black",c:3,items:["New environment","Instant cutover","Fast switch back"]},{t:"Blue-green",c:0,items:["Two environments","Shift traffic blue → green","Easy rollback"]},{t:"Canary",c:2,items:["5% of users first","Watch metrics","Lowest risk"]},{t:"Immutable",c:4,items:["Fresh cloned servers","Dispose of old","No configuration drift"]}])]],
    tb:[{cap:"Strategies compared", head:["Strategy","Downtime","Rollback","Extra infrastructure","Users exposed to a bad release","Good for"], rows:[["In-place","Usually yes","Slow (redeploy old version)","None","All","Dev/test, small internal apps"],["Rolling","No","Slow (roll back batch by batch)","Little (one batch)","Growing share","Everyday releases"],["Red-black","No","Instant (switch back)","Double, during deploy","All, after cutover","Fast, all-at-once releases with quick undo"],["Blue-green","No","Fast (shift traffic back)","Double, during deploy","Gradually growing","Major releases needing a safe switch"],["Canary","No","Fast (stop the canary)","Small","Only the canary group","Risky changes, high-traffic systems"],["Immutable","No","Fast (keep old servers until done)","Double, during deploy","Depends on cutover","Cloud, containers, consistent environments"]]}],
    dd:[
     {t:"1. In-place deployment", d:"<b>In simple words:</b> stop the application on the existing servers, install the new version on the <b>same servers</b>, and start it again. It is the simplest and cheapest method, but users may see errors or downtime while servers restart, and if the new version is broken you must redeploy the old one. <b>Think of it like</b> repainting a shop while it is still open: quick and cheap, but customers are disturbed.",
      dg:["In-place: the same servers are updated.", F([["Servers run v1"],["Stop app","downtime starts"],["Install v2","same machines"],["Start app","downtime ends"],["Verify","rollback = reinstall v1"]],{hl:[1]})]},
     {t:"2. Rolling deployment", d:"<b>In simple words:</b> update the servers <b>a few at a time</b>. Each batch is removed from the load balancer, updated, health-checked and put back, then the next batch follows. Users are never without service, but for a while some servers run v1 and others v2, so both versions must work together. <b>Real-world example:</b> Facebook updates small subsets of servers or clusters at a time, gradually rolling changes across its infrastructure without interrupting users.",
      dg:["Rolling deployment across four servers (highlighted = v2).", MI([{t:"Start",s:"all on v1",L:[v(4,0)],e:[]},{t:"Batch 1",s:"1 of 4 updated",L:[v(4,1)],e:[]},{t:"Batch 2",s:"2 of 4 updated",L:[v(4,2)],e:[]},{t:"Done",s:"all on v2",L:[v(4,4)],e:[]}],{per:2,bw:70})],
      code:["yaml",`# Kubernetes Deployment: rolling update, one pod at a time
spec:

    rollingUpdate:

      maxSurge: 1           # at most 1 extra pod created temporarily`,"Rolling update in Kubernetes"]},
     {t:"3. Red-black deployment", d:"<b>In simple words:</b> build a <b>complete new environment</b> (black) with the new version next to the live one (red). Test it. Then switch the load balancer so <b>all traffic moves at once</b> (an instant cutover). The red environment is kept for a while so you can switch straight back if needed. <b>Real-world example:</b> Netflix popularised the name: it maintains two identical production environments, updates the one not receiving traffic, and switches traffic over once the new version is validated.",
      dg:["Red-black: an instant cutover between two full environments.", MI([{t:"Before cutover",s:"Red serves users; black has v2, no traffic",L:[["Load balancer"],["*Red env (v1, live)","Black env (v2, idle)"]],e:[[0,0,1,0]]},{t:"After cutover",s:"All traffic switched instantly; red kept for rollback",L:[["Load balancer"],["Red env (v1, standby)","*Black env (v2, live)"]],e:[[0,0,1,1]]}],{per:2,bw:150})]},
     {t:"4. Blue-green deployment", d:"<b>In simple words:</b> keep two identical environments: <b>blue</b> runs the current version and <b>green</b> gets the new one. After green is tested, traffic moves from blue to green, in the source material’s description <b>gradually</b> (for example 10% → 50% → 100% using weighted load-balancer rules), so green progressively replaces blue. Blue stays ready, so rollback is just moving traffic back. <b>Real-world example:</b> AWS uses blue-green deployments for its cloud services: the blue environment serves live traffic while green is updated, then traffic is switched once the update is validated. <b>Note:</b> many teams treat blue-green and red-black as the same idea; the main practical difference is whether traffic moves all at once or in steps.",

     {t:"5. Canary deployment", d:"<b>In simple words:</b> release the new version to a <b>small group of users first</b> (the “canary”, named after canaries coal miners used as an early warning). The load balancer sends, say, 5% of requests to the new version and 95% to the old. The team watches error rates, latency and business metrics. If it looks good, the new version is rolled out to everyone, often in steps; if not, traffic is moved back and only a few users were affected. Canary combines <b>canary testing</b> with a <b>rolling deployment</b>. <b>Real-world example:</b> Google exposes a small percentage of Search users to a new version while most continue on the stable one, collecting feedback and metrics before rolling out to everyone.",

     {t:"6. Immutable deployment", d:"<b>In simple words:</b> never change a running server. For every release, <b>build brand-new servers</b> (or containers) from a fresh image containing the new version, move traffic to them, and then <b>delete the old ones</b>. Because servers are never patched by hand, every environment is identical and there is no “configuration drift”. Containers and Kubernetes work this way by default. <b>Real-world example:</b> Netflix applies immutable infrastructure to its streaming platform: instead of updating existing instances, it creates new server images for each deployment, keeping environments consistent and repeatable.",

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },

};

const ORDER = [{v:"home"}];
PHASES.forEach(ph => { ORDER.push({v:"phase", p:ph.p}); SESSIONS.filter(s => s.p === ph.p).forEach(s => ORDER.push({v:"session", n:s.n})); });
const keyOf = r => r.v === "home" ? "home" : r.v === "phase" ? "phase-" + r.p : "session-" + r.n;

function parseRoute() {
  const h = location.hash.replace("#", "");
  let m;
  if ((m = h.match(/^phase-(\d)$/)) && PHASES.some(p => p.p == m[1])) return {v:"phase", p:+m[1]};
  if ((m = h.match(/^session-(\d+)$/)) && SESSIONS.some(s => s.n == m[1])) return {v:"session", n:+m[1]};
  return {v:"home"};
}

function hl(src, lang) {
  const e = esc(src);
  const re = {tsx:/(^|\s)(\/\/.*)$/, kotlin:/(^|\s)(\/\/.*)$/, java:/(^|\s)(\/\/.*)$/, ts:/(^|\s)(\/\/.*)$/, dart:/(^|\s)(\/\/.*)$/, css:/(^|\s)(\/\*.*\*\/)$/, html:/(^|\s)(&lt;!--.*--&gt;)$/, js:/(^|\s)(\/\/.*)$/, jsx:/(^|\s)(\/\/.*)$/, json:/(^|\s)(\/\/.*)$/, sql:/(^|\s)(--.*)$/, bash:/(^|\s)(#.*)$/, yaml:/(^|\s)(#.*)$/, http:/(^)(---.*---)$/}[lang];
  let out = e.split("\n").map(line => {
    if (re) line = line.replace(re, (m0, a, c) => `${a}<span class="cmt">${c}</span>`);
    if (lang === "json" || lang === "sql") line = line.replace(/^(\s*)(--.*)$/, "$1<span class=\"cmt\">$2</span>");
    if (lang === "gherkin") line = line.replace(/^(\s*)(Story:|Scenario:|Given|When|Then|And|As a|I want|So that)/, "$1<b class=\"kw\">$2</b>");
    if (lang === "markdown") line = line.replace(/^(#+ .*)$/, "<b class=\"kw\">$1</b>").replace(/^(R\d)/, "<b class=\"kw\">$1</b>");
    if (lang === "text") line = line.replace(/^([A-Z][A-Z' ]{3,}[A-Z]|[❌✅] [A-Z]+)$/, "<b class=\"kw\">$1</b>");
    return line;
  }).join("\n");
  return out;
}

/* ---------- metro map (home) ---------- */
function metroMap() {
  const rows = PHASES.map(ph => SESSIONS.filter(s => s.p === ph.p));
  const L = 70, R = 830, gap = 132, top = 66, W = 900, H = top + gap * 4 + 80;
  let lines = "", st = "", lab = "";
  rows.forEach((ss, i) => {
    const y = top + i * gap, ltr = i % 2 === 0, k = ss.length;
    const xs = ss.map((s, j) => { const t = k === 1 ? 0.5 : j / (k - 1); const x = 130 + t * (R - L - 120); return ltr ? x : W - x; });
    const start = i === 0 ? xs[0] : (ltr ? L : R);
    const end = ltr ? R : L;
    let d = `M${start},${y} L${end},${y}`;
    if (i < rows.length - 1) d += ltr ? ` A${gap/2},${gap/2} 0 0,1 ${end},${y + gap}` : ` A${gap/2},${gap/2} 0 0,0 ${end},${y + gap}`;
    lines += `<path d="${d}" class="mline" style="stroke:var(--p${i+1})"/>`;
    lab += `<a href="#phase-${i+1}" class="mphase"><text x="${ltr ? (i === 0 ? xs[0] - 18 : L + 10) : R - 10}" y="${y - 30}" text-anchor="${ltr ? "start" : "end"}" style="fill:var(--p${i+1})">Phase ${i+1}: ${esc(PHASES[i].t)}</text></a>`;
    ss.forEach((s, j) => {
      const x = xs[j], isDone = done.has(s.n);
      st += `<a href="#session-${s.n}" class="mst" aria-label="Session ${s.n}: ${esc(s.t)}"><circle cx="${x}" cy="${y}" r="15" class="mdot${isDone ? " done" : ""}" style="stroke:var(--p${i+1});${isDone ? `fill:var(--p${i+1})` : ""}"/><text x="${x}" y="${y}" class="mnum" text-anchor="middle" dominant-baseline="central"${isDone ? ` style="fill:var(--on-p${i+1})"` : ""}>${s.n}</text>` +
        txt(x, y + 32 + (MAPL[s.n].split("\n").length - 1) * 7.5, MAPL[s.n], "mlab") + `</a>`;
    });
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="metro" role="img" aria-label="Course map: 5 phases, 24 sessions">${lines}${lab}${st}</svg>`;
}

/* ---------- sidebar ---------- */
function buildSide() {
  let h = `<a href="#home" class="nav-home" data-key="home">Course map</a>`;
  PHASES.forEach(ph => {
    h += `<div class="nav-phase" style="--pc:var(--p${ph.p})"><a href="#phase-${ph.p}" class="nav-ph" data-key="phase-${ph.p}"><span class="nav-pn">Phase ${ph.p}</span>${esc(ph.short)}</a><ol class="nav-st">`;
    SESSIONS.filter(s => s.p === ph.p).forEach(s => {
      h += `<li><a href="#session-${s.n}" data-key="session-${s.n}" class="${done.has(s.n) ? "is-done" : ""}"><span class="dot" aria-hidden="true"></span><span class="nav-num">${s.n}</span><span class="nav-t">${esc(s.t)}</span></a></li>`;
    });
    h += `</ol></div>`;
  });
  document.getElementById("nav").innerHTML = h;
}
function updateSide(key) {
  document.querySelectorAll("#nav a").forEach(a => {
    a.toggleAttribute("aria-current", a.dataset.key === key);
    const m = a.dataset.key.match(/^session-(\d+)$/);
    if (m) a.classList.toggle("is-done", done.has(+m[1]));
  });
  const pct = Math.round(done.size / SESSIONS.length * 100);
  document.getElementById("progress").innerHTML = `<div class="bar"><i style="width:${pct}%"></i></div><span>${done.size} of ${SESSIONS.length} sessions covered</span>`;
  const cur = document.querySelector("#nav a[aria-current]");
  if (cur && window.innerWidth > 960) cur.scrollIntoView({block: "nearest"});
}

/* ---------- views ---------- */
function viewHome() {
  return `<section class="hero inverse">
    <h1 class="hero-t">From your first line of code to AI-driven delivery</h1>
    <p class="hero-s">How real web and mobile software gets built, explained for engineers joining the software industry. Five phases, 24 sessions, and one food-ordering case study followed all the way through.</p>
    <div class="hero-cta"><a class="btn pri" href="#phase-1">Start with Phase 1</a><a class="btn ghost" href="#session-5">Jump to the SDLC</a></div>
    <div class="hero-stats"><span><b>5</b> phases</span><span><b>24</b> sessions</span><span><b>120</b> sub-topics, each with a diagram</span></div>
    <div class="map-wrap" aria-label="Course map"><div class="scroll-x">${metroMap()}</div>
    <p class="map-hint">Each line is a phase and each station a session. Tap any station to open it.</p></div>
  </section>
  <section class="intro-grid">
    <div class="casestudy">
      <h2>The case study used throughout</h2>
      <p>Every concept in this course is illustrated with one realistic case study: a <b>food-ordering platform</b> made up of a customer mobile app, a restaurant web dashboard and a cloud backend. Throughout the course, “the platform” refers to this system. Together, the sessions follow a single order from the first business idea, through design, code, tests and deployment, to an AI-assisted feature in production.</p>
      <div class="scroll-x">${renderDiagram({type:"graph", h:150, nodes:[
        {id:"c",x:10,y:50,w:140,l:"Customer app",s:"Android / iOS"},{id:"r",x:10,y:100,w:140,h:40,l:"Restaurant web"},
        {id:"a",x:210,y:60,w:140,l:"Order API",s:"orders, payments",k:"acc"},{id:"d",x:410,y:52,w:130,h:60,l:"Database",k:"db"},
        {id:"p",x:600,y:20,w:150,l:"Payment gateway",k:"ext"},{id:"q",x:600,y:90,w:150,l:"Rider & SMS",k:"ext"}],
        edges:[{f:"c",t:"a",d:"M150,72 H180 V82 H210"},{f:"r",t:"a",d:"M150,120 H180 V90 H210"},{f:"a",t:"d"},{f:"d",t:"p",d:"M540,82 H570 V42 H600",dash:1},{f:"d",t:"q",d:"M540,82 H570 V112 H600",dash:1}]}, "Food-ordering platform overview")}</div>
    </div>
    <div class="howto">
      <h2>Using this as a trainer</h2>
      <p>Each session follows the same rhythm, so participants always know where they are:</p>
      <ol class="rhythm"><li>Why it matters and the big-picture diagram</li><li>How it works: an animated four-step flow</li><li>Five sub-topics, each with an explanation, key points, flow diagrams, comparison tables and a worked example</li><li>Worked example or code</li><li>Common mistakes and a hands-on exercise</li><li>Quick check question</li></ol>
      <p class="keys"><kbd>←</kbd> <kbd>→</kbd> move between sessions. <kbd>P</kbd> switches presenter view with larger text and no sidebar.</p>
    </div>
  </section>
  <section class="phase-list">
    <h2>The five phases</h2>
    ${PHASES.map(ph => { const ss = SESSIONS.filter(s => s.p === ph.p); return `<a class="pcard" href="#phase-${ph.p}" style="--pc:var(--p${ph.p});--on-pc:var(--on-p${ph.p})">
      <span class="pcard-n">${ph.p}</span><span class="pcard-b"><span class="pcard-t">${esc(ph.t)}</span><span class="pcard-i">${esc(ph.intro)}</span><span class="pcard-s">Sessions ${ss[0].n}–${ss[ss.length-1].n}: ${ss.map(s => esc(SHORT[s.n])).join(", ")}</span></span></a>`; }).join("")}
  </section>`;
}

function viewPhase(p) {
  const ph = PHASES.find(x => x.p === p), ss = SESSIONS.filter(s => s.p === p);
  return `<div class="phase-page" style="--pc:var(--p${p});--on-pc:var(--on-p${p});--pc-soft:var(--p${p}-soft)">
  <header class="ph-head"><p class="crumb"><a href="#home">Course map</a></p>
    <div class="ph-band"><span class="ph-big">${p}</span><div><p class="ph-label">Phase ${p} of 5, ${ss.length} sessions</p><h1 tabindex="-1">${esc(ph.t)}</h1></div></div>
    <p class="lede">${esc(ph.intro)}</p></header>
  <ol class="ph-stations">${ss.map(s => `<li><a href="#session-${s.n}" class="${done.has(s.n) ? "is-done" : ""}"><span class="ph-dot">${s.n}</span><span><span class="ph-st">${esc(s.t)}</span><span class="ph-tag">${esc(s.tag)}</span></span></a></li>`).join("")}</ol>
  <div class="ph-cols">
    <section class="card"><h2>By the end of this phase</h2><ul class="ticks">${ss.map(s => `<li><b>Explain ${esc(s.t)}</b> and complete the practical: ${esc(s.tryit.task)}</li>`).join("")}</ul></section>
    <section class="card discuss"><h2>Phase discussion</h2><p>${esc(ph.discuss)}</p></section>
  </div>
  <a class="btn pri" href="#session-${ss[0].n}">Start session ${ss[0].n}: ${esc(ss[0].t)}</a>
  </div>`;
}

function viewSession(n) {
  const s = SESSIONS.find(x => x.n === n), ph = PHASES.find(x => x.p === s.p), deep = DEEP[n] || [];
  const i = ORDER.findIndex(r => r.v === "session" && r.n === n), prev = ORDER[i-1], next = ORDER[i+1];
  const label = r => r ? (r.v === "home" ? "Course map" : r.v === "phase" ? "Phase " + r.p + " overview" : "Session " + r.n + ": " + SESSIONS.find(x => x.n === r.n).t) : "";
  const fig = (cap, spec) => `<figure class="fig"><div class="scroll-x">${renderDiagram(spec, cap)}</div><figcaption>${esc(cap)}</figcaption></figure>`;
  const table = t => `<div class="tblwrap"><p class="tcap">${esc(t.cap)}</p><div class="scroll-x"><table class="tbl"><thead><tr>${t.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${t.rows.map(r => `<tr>${r.map((c, k) => k === 0 ? `<th scope="row">${esc(c)}</th>` : `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  const chips = [`<button class="chip" data-jump="sec-overview">Overview</button>`].concat(s.concepts.map((c, k) => `<button class="chip" data-jump="sec-${k}"><span>${k+1}</span>${esc(c.t)}</button>`)).concat([`<button class="chip" data-jump="sec-practice">Practice</button>`]).join("");
  const subs = s.concepts.map((c, k) => {
    const d = deep[k] || {};
    return `<section class="sub" id="sec-${k}">
      <header class="sub-h"><span class="sub-n">${k+1}</span><div><p class="sub-of">Sub-topic ${k+1} of ${s.concepts.length}</p><h2>${esc(c.t)}</h2><p class="sub-s">${esc(c.s)}</p></div></header>
      ${simpleBox(LAY[n] && LAY[n].s && LAY[n].s[k])}
      <div class="sub-body">
        <div class="sub-text"><p>${c.d}</p>${d.more ? `<p>${d.more}</p>` : ""}</div>
        ${d.pts ? `<aside class="kp"><h3>Key points</h3><ul>${d.pts.map(p => `<li>${p}</li>`).join("")}</ul></aside>` : ""}
      </div>
      ${(d.dg || []).map(([cap, spec]) => fig(cap, spec)).join("")}
      ${(d.tb || []).map(table).join("")}
      ${d.dd ? `<div class="dds"><h3 class="dd-h">Deep dive</h3>${d.dd.map(x => `<div class="dd"><h4>${esc(x.t)}</h4><p>${x.d}</p>${x.dg ? fig(x.dg[0], x.dg[1]) : ""}${x.tb ? table(Object.assign({cap: x.tb.cap || ""}, x.tb)) : ""}${x.code ? `<figure class="code"><figcaption><span>${esc(x.code[2] || "Example")}</span><button class="btn sm copy" data-copy>Copy</button></figcaption><pre><code>${hl(x.code[1], x.code[0])}</code></pre></figure>` : ""}</div>`).join("")}</div>` : ""}
      <div class="slip"><div class="slip-h"><span class="slip-ic" aria-hidden="true"></span>Real-world example</div><p>${c.ex}</p></div>
    </section>`;
  }).join("");
  return `<article class="session" style="--pc:var(--p${s.p});--on-pc:var(--on-p${s.p});--pc-soft:var(--p${s.p}-soft)">
  <header class="banner">
    <svg class="banner-art" viewBox="0 0 300 200" aria-hidden="true"><path d="M-10 150 H120 A40 40 0 0 0 160 110 V40 A30 30 0 0 1 190 10 H320" /><path d="M-10 180 H200 A50 50 0 0 0 250 130 V-10" /><circle cx="160" cy="80" r="9"/><circle cx="90" cy="150" r="9"/><circle cx="250" cy="150" r="9"/></svg>
    <p class="crumb"><a href="#phase-${s.p}">Phase ${s.p}: ${esc(ph.t)}</a></p>
    <div class="s-title"><span class="s-num" aria-hidden="true">${s.n}</span><div><p class="s-of">Session ${s.n} of 24</p><h1 tabindex="-1">${esc(s.t)}</h1></div></div>
    <p class="lede">${esc(s.tag)}</p>
  </header>
  <nav class="chips" aria-label="Jump to section">${chips}</nav>

  <section class="sec" id="sec-overview">
    ${simpleBox(LAY[n], true)}
    <p class="why"><b>Why it matters:</b> ${esc(s.why)}</p>
    <h2 class="sec-h">The big picture</h2>
    ${s.diagrams.map(d => fig(d.cap, d.spec)).join("")}
    <h2 class="sec-h">How it works, step by step</h2>
    <div class="flow" data-n="${s.flow.steps.length}">
      <div class="flow-track"><i class="flow-fill"></i></div>
      <ol class="flow-steps">${s.flow.steps.map((st, k) => `<li><button class="fstep${k === 0 ? " on" : ""}" data-i="${k}"><span class="fdot">${k+1}</span><span class="ft">${esc(st.t)}</span></button></li>`).join("")}</ol>
      <div class="flow-detail" aria-live="polite">${flowDetail(s, 0)}</div>
      <div class="flow-ctrl"><button class="btn sm" data-flow="prev">Previous step</button><button class="btn sm pri" data-flow="play">Play the flow</button><button class="btn sm" data-flow="next">Next step</button></div>
    </div>
    <h2 class="sec-h">The ${s.concepts.length === 5 ? "five" : s.concepts.length} sub-topics</h2>
    <ol class="toc">${s.concepts.map((c, k) => `<li><button data-jump="sec-${k}"><span class="toc-n">${k+1}</span><span><b>${esc(c.t)}</b><span>${esc(c.s)}</span></span></button></li>`).join("")}</ol>
  </section>

  ${subs}

  <section class="sec practice" id="sec-practice">
    <h2 class="sec-h">Practice and recap</h2>
    ${s.table ? table(s.table) : ""}
    ${s.code ? `<figure class="code"><figcaption><span>${esc(s.code.cap)}</span><button class="btn sm copy" data-copy>Copy</button></figcaption><pre><code>${hl(s.code.src, s.code.lang)}</code></pre></figure>` : ""}
    <div class="two">
      <section class="card warnc"><h3>Common mistakes</h3><ul class="xlist">${s.mistakes.map(m => `<li>${esc(m)}</li>`).join("")}</ul></section>
      <section class="card tryc"><h3>Try it</h3><p class="task">${esc(s.tryit.task)}</p><ol class="steps">${s.tryit.steps.map(t => `<li>${esc(t)}</li>`).join("")}</ol><details><summary>Show a hint</summary><p>${esc(s.tryit.hint)}</p></details></section>
    </div>
    <section class="quiz card"><h3>Quick check</h3><p class="q">${esc(s.quiz.q)}</p>
      <div class="qopts">${s.quiz.o.map((o, k) => `<button class="qopt" data-i="${k}">${esc(o)}</button>`).join("")}</div>
      <p class="qwhy" hidden></p></section>
  </section>

  <footer class="s-foot">
    <button class="btn mark ${done.has(n) ? "on" : ""}" data-mark="${n}" aria-pressed="${done.has(n)}">${done.has(n) ? "Covered ✓" : "Mark as covered"}</button>
    <nav class="pn" aria-label="Session navigation">
      ${prev ? `<a class="btn" href="${hrefOf(prev)}" rel="prev"><span class="pn-l">Previous</span>${esc(label(prev))}</a>` : ""}
      ${next ? `<a class="btn pri" href="${hrefOf(next)}" rel="next"><span class="pn-l">Next</span>${esc(label(next))}</a>` : `<a class="btn pri" href="#home"><span class="pn-l">Finished</span>Back to the course map</a>`}
    </nav>
  </footer>
  </article>`;
}

function simpleBox(x, big) {
  if (!x) return "";
  return `<div class="simple${big ? " big" : ""}"><p class="simple-tag">In simple words</p><${big ? "h2" : "h3"} class="simple-q">${esc(x.q)}</${big ? "h2" : "h3"}><p class="simple-a">${esc(x.a)}</p><p class="simple-an"><span>Think of it like</span>${esc(x.an)}</p></div>`;
}
function conceptPanel(s, k) {
  const c = s.concepts[k];
  return `<h3>${esc(c.t)}</h3><p class="cs">${esc(c.s)}</p><p>${c.d}</p><div class="ex"><span class="ex-l">Example</span><p>${c.ex}</p></div>`;
}
function flowDetail(s, k) {
  const st = s.flow.steps[k];
  return `<p class="fd-h">Step ${k+1}: ${esc(st.t)}</p><p>${st.d}</p>`;
}

/* ---------- render + events ---------- */
let current = null, playTimer = null;
function render() {
  clearInterval(playTimer); playTimer = null;
  const r = parseRoute(); current = r;
  const main = document.getElementById("main");
  main.innerHTML = r.v === "home" ? viewHome() : r.v === "phase" ? viewPhase(r.p) : viewSession(r.n);
  const title = r.v === "home" ? "Course map" : r.v === "phase" ? "Phase " + r.p : "Session " + r.n + ": " + SESSIONS.find(x => x.n === r.n).t;
  document.title = title + " · Software Engineering Foundation";
  updateSide(keyOf(r));
  document.body.dataset.phase = r.v === "home" ? "" : (r.p || SESSIONS.find(x => x.n === r.n).p);
  window.scrollTo(0, 0);
  closeNav();
  if (window._io) window._io.disconnect();
  if (r.v === "session" && "IntersectionObserver" in window) {
    const chips = [...main.querySelectorAll(".chip")];
    window._io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      chips.forEach(c => c.classList.toggle("on", c.dataset.jump === e.target.id));
      const on = chips.find(c => c.dataset.jump === e.target.id);
      if (on) on.parentElement.scrollTo({left: on.offsetLeft - 40, behavior: "smooth"});
    }), {rootMargin: "-25% 0px -65% 0px"});
    main.querySelectorAll(".sec, .sub").forEach(x => window._io.observe(x));
  }
  const h1 = main.querySelector("h1");
  if (h1 && document.activeElement && document.activeElement !== document.body) h1.focus({preventScroll: true});
}

function setFlow(flow, k) {
  const n = +flow.dataset.n, s = SESSIONS.find(x => x.n === current.n);
  k = (k + n) % n;
  flow.dataset.i = k;
  flow.querySelectorAll(".fstep").forEach((b, j) => { b.classList.toggle("on", j === k); b.classList.toggle("past", j < k); });
  flow.querySelector(".flow-fill").style.width = (k / (n - 1) * 100) + "%";
  flow.querySelector(".flow-detail").innerHTML = flowDetail(s, k);
}

document.addEventListener("click", e => {
  const t = e.target;
  const tab = t.closest(".ctab");
  if (tab) {
    const s = SESSIONS.find(x => x.n === current.n), k = +tab.dataset.i;
    document.querySelectorAll(".ctab").forEach(b => b.setAttribute("aria-selected", b === tab));
    document.getElementById("cpanel").innerHTML = conceptPanel(s, k);
    return;
  }
  if (t.closest("[data-lb-close]") || t.classList.contains("lightbox")) { closeLightbox(); return; }
  const fg = t.closest(".fig");
  if (fg && !t.closest(".lightbox")) { openLightbox(fg); return; }
  const jp = t.closest("[data-jump]");
  if (jp) { const el = document.getElementById(jp.dataset.jump); if (el) { const off = (window.innerWidth <= 960 ? 124 : 72); window.scrollTo({left: 0, top: el.getBoundingClientRect().top + window.scrollY - off, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); } return; }
  const fs = t.closest(".fstep");
  if (fs) { clearInterval(playTimer); playTimer = null; resetPlay(); setFlow(fs.closest(".flow"), +fs.dataset.i); return; }
  const fc = t.closest("[data-flow]");
  if (fc) {
    const flow = fc.closest(".flow"), k = +(flow.dataset.i || 0), a = fc.dataset.flow;
    if (a === "play") {
      if (playTimer) { clearInterval(playTimer); playTimer = null; resetPlay(); return; }
      setFlow(flow, 0); fc.textContent = "Pause";
      playTimer = setInterval(() => {
        const cur = +flow.dataset.i;
        if (cur >= +flow.dataset.n - 1) { clearInterval(playTimer); playTimer = null; resetPlay(); return; }
        setFlow(flow, cur + 1);
      }, 2600);
    } else { clearInterval(playTimer); playTimer = null; resetPlay(); setFlow(flow, a === "next" ? k + 1 : k - 1); }
    return;
  }
  const q = t.closest(".qopt");
  if (q && !q.disabled) {
    const s = SESSIONS.find(x => x.n === current.n), k = +q.dataset.i, ok = k === s.quiz.a;
    document.querySelectorAll(".qopt").forEach((b, j) => { b.disabled = true; if (j === s.quiz.a) b.classList.add("right"); });
    if (!ok) q.classList.add("wrong");
    const w = document.querySelector(".qwhy");
    w.hidden = false; w.className = "qwhy " + (ok ? "good" : "bad");
    w.innerHTML = `<b>${ok ? "Correct." : "Not quite."}</b> ${esc(s.quiz.why)} <button class="linkbtn" data-retry>Try again</button>`;
    return;
  }
  if (t.closest("[data-retry]")) {
    document.querySelectorAll(".qopt").forEach(b => { b.disabled = false; b.classList.remove("right", "wrong"); });
    document.querySelector(".qwhy").hidden = true; return;
  }
  const mk = t.closest("[data-mark]");
  if (mk) {
    const n = +mk.dataset.mark;
    done.has(n) ? done.delete(n) : done.add(n); saveDone();
    mk.classList.toggle("on", done.has(n)); mk.setAttribute("aria-pressed", done.has(n));
    mk.textContent = done.has(n) ? "Covered ✓" : "Mark as covered";
    updateSide(keyOf(current)); return;
  }
  const cp = t.closest("[data-copy]");
  if (cp) {
    const code = cp.closest(".code").querySelector("code").innerText;
    const okMsg = () => { cp.textContent = "Copied"; setTimeout(() => cp.textContent = "Copy", 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(code).then(okMsg, () => { cp.textContent = "Select and copy manually"; });
    return;
  }
  if (t.closest("#menuBtn")) { document.body.classList.toggle("nav-open"); document.getElementById("menuBtn").setAttribute("aria-expanded", document.body.classList.contains("nav-open")); return; }
  if (t.closest(".scrim")) { closeNav(); return; }
  if (t.closest("[data-theme-toggle]")) { toggleTheme(); return; }
  if (t.closest("[data-present]")) { togglePresent(); return; }
  if (t.closest("[data-go]")) { go(+t.closest("[data-go]").dataset.go); return; }
});
let lastFocus = null;
function openLightbox(fig) {
  const svg = fig.querySelector("svg"); if (!svg) return;
  lastFocus = document.activeElement;
  const cap = fig.querySelector("figcaption"), lb = document.createElement("div");
  lb.className = "lightbox"; lb.setAttribute("role", "dialog"); lb.setAttribute("aria-modal", "true");
  lb.innerHTML = `<div class="lb-inner"><div class="lb-bar"><p>${cap ? esc(cap.textContent.replace("⤢ Click to enlarge", "").trim()) : ""}</p><button class="btn sm" data-lb-close>Close ✕</button></div><div class="lb-body">${svg.outerHTML}</div></div>`;
  document.body.appendChild(lb);
  lb.querySelector("[data-lb-close]").focus();
}
function closeLightbox() {
  const lb = document.querySelector(".lightbox");
  if (lb) { lb.remove(); if (lastFocus) lastFocus.focus(); }
}
function resetPlay() { const b = document.querySelector('[data-flow="play"]'); if (b) b.textContent = "Play the flow"; }
function closeNav() { document.body.classList.remove("nav-open"); const b = document.getElementById("menuBtn"); if (b) b.setAttribute("aria-expanded", "false"); }

function go(dir) {
  const i = ORDER.findIndex(r => keyOf(r) === keyOf(current));
  const r = ORDER[i + dir];
  if (r) location.hash = keyOf(r);
}
function toggleTheme() {
  const root = document.documentElement;
  const isDark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = isDark ? "light" : "dark";
  store.set("sdlc-theme", root.dataset.theme);
}
function togglePresent() {
  document.body.classList.toggle("presenting");
  const on = document.body.classList.contains("presenting");
  document.querySelectorAll("[data-present]").forEach(b => b.setAttribute("aria-pressed", on));
}
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, [contenteditable]") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.querySelector(".lightbox") && e.key !== "Escape") return;
  if (e.key === "ArrowRight") { go(1); }
  else if (e.key === "ArrowLeft") { go(-1); }
  else if (e.key === "p" || e.key === "P") { togglePresent(); }
  else if (e.key === "Escape" && document.querySelector(".lightbox")) { closeLightbox(); return; }
  else if (e.key === "Escape") { if (document.body.classList.contains("presenting")) togglePresent(); closeNav(); }
});

const savedTheme = store.get("sdlc-theme", null);
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
buildSide();
window.addEventListener("hashchange", render);
